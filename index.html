<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop Key</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0f1220;--cd:#181c30;--tx:#e8eaf6;--mu:#8b90b0;--ac:#4aa8ff;--ok:#2ecc71;--no:#ff5c6c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--cd);position:sticky;top:0;z-index:5}
.w{max-width:900px;margin:auto;padding:12px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 13px;font-weight:600;cursor:pointer}
button.g{background:#2a2f4d}button.ok{background:var(--ok)}button.no{background:var(--no)}button:disabled{opacity:.5}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #2a2f4d;background:#0f1220;color:var(--tx);margin:4px 0;font:inherit}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow:auto}.tabs button{white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.c{background:var(--cd);border-radius:12px;padding:14px;margin-bottom:10px}.mu{color:var(--mu);font-size:13px}.pr{color:var(--ok);font-weight:700;font-size:17px}
.m{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
.m>div{background:var(--cd);border-radius:14px;padding:18px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
pre{background:#0f1220;padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-all;user-select:all}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}img.qr{width:100%;border-radius:8px;background:#fff}
</style></head><body>
<header><b>🛒 Shop Key</b><div id="hd"></div></header>
<div class="w"><div class="tabs" id="tb"></div><div id="v"></div></div>
<div class="m" id="m"><div id="mc"></div></div>
<script>
// ====== CẤU HÌNH: dán firebaseConfig của mày vào đây ======
const firebaseConfig={apiKey:"",authDomain:"",projectId:"",appId:""};
const ADMINS=["8618983578"];          // Telegram ID admin
// ===========================================================
firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),FV=firebase.firestore.FieldValue;
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const $=s=>document.querySelector(s),F=n=>Number(n||0).toLocaleString('vi-VN')+'đ',E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let U=null,P=[],TAB='shop';
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const isAdmin=()=>U&&ADMINS.includes(U.tgid||'');
function modal(h){$('#mc').innerHTML=h;$('#m').style.display='flex'}function closeM(){$('#m').style.display='none'}
$('#m').onclick=e=>{if(e.target.id=='m')closeM()};
async function init(){
 if(!firebaseConfig.projectId){hd();tabs();return showErr('thiếu config')}
 try{
 const t=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
 if(t){await load('tg_'+t.id,{name:t.first_name||t.username||'User',tgid:String(t.id)})}
 else{const s=localStorage.getItem('uid');if(s)await load(s)}
 }catch(e){hd();tabs();return showErr(e)}
 hd();tabs();go('shop')}
async function load(id,extra){const r=db.collection('users').doc(id);let d=await r.get();
 if(!d.exists){await r.set({balance:0,created:FV.serverTimestamp(),...(extra||{})});d=await r.get()}
 U={id,...d.data()};r.onSnapshot(s=>{if(s.exists){U={id,...s.data()};hd()}})}
function hd(){$('#hd').innerHTML=U?`<span class="mu">${E(U.name||U.id)}</span> · <b style="color:var(--ok)">${F(U.balance)}</b> ${tg?'':'<button class="g" onclick="out()">Thoát</button>'}`:`<button onclick="auth()">Đăng nhập</button>`}
function tabs(){$('#tb').innerHTML=`<button onclick="go('shop')">Cửa hàng</button><button class="g" onclick="go('orders')">Đơn của tôi</button><button class="g" onclick="go('topup')">Nạp tiền</button>${isAdmin()?'<button class="no" onclick="go(\'admin\')">Admin</button>':''}`}
function out(){localStorage.removeItem('uid');U=null;hd();tabs();go('shop')}
function auth(){modal(`<h3>Đăng nhập / Đăng ký</h3><input id="u" placeholder="Tên đăng nhập"><input id="p" type="password" placeholder="Mật khẩu (≥6 ký tự)"><button style="width:100%" onclick="sub()">Vào</button><p id="e" style="color:var(--no)"></p>`)}
async function sub(){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;
 if(!/^[a-z0-9_]{3,20}$/.test(u)||p.length<6)return $('#e').textContent='Tên 3-20 ký tự a-z0-9_, mật khẩu ≥ 6 ký tự';
 const id='u_'+u,h=await sha(p),r=db.collection('users').doc(id),d=await r.get();
 if(d.exists){if(d.data().pw!==h)return $('#e').textContent='Sai mật khẩu'}else await r.set({balance:0,pw:h,name:u,created:FV.serverTimestamp()});
 localStorage.setItem('uid',id);await load(id);closeM();hd();tabs();go(TAB)}
async function go(t){try{await go0(t)}catch(e){showErr(e)}}
function showErr(e){const m=String(e&&e.message||e),c=e&&e.code||'';let h='';
 if(!firebaseConfig.projectId)h='Chưa dán firebaseConfig vào file index.html (đang để trống).';
 else if(/permission|insufficient/i.test(c+m))h='Firestore đang chặn truy cập. Vào Firebase → Firestore Database → Rules, đổi thành <code>allow read, write: if true;</code> rồi Publish.';
 else if(/offline|unavailable/i.test(c+m))h='Không kết nối được Firestore. Kiểm tra mạng, hoặc chưa tạo Firestore Database trong project.';
 else h='Lỗi không rõ.';
 $('#v').innerHTML='<div class="c"><b style="color:var(--no)">Không tải được dữ liệu</b><p>'+h+'</p><pre>'+E(c+' '+m)+'</pre></div>'}
async function go0(t){TAB=t;const v=$('#v');
 if(t=='shop'){v.innerHTML='Đang tải...';const s=await db.collection('products').where('active','==',true).get();
  P=s.docs.map(d=>({id:d.id,...d.data()}));
  v.innerHTML=`<input id="q" placeholder="Tìm sản phẩm..." oninput="draw()"><div class="grid" id="g"></div>`;draw()}
 else if(!U)auth();
 else if(t=='orders'){const s=await db.collection('orders').where('uid','==',U.id).get();
  const o=s.docs.map(d=>d.data()).sort((a,b)=>(b.ts?.seconds||0)-(a.ts?.seconds||0));
  v.innerHTML=o.map(x=>`<div class="c"><b>${E(x.name)}</b> x${x.qty} · ${F(x.total)}<div class="mu">${x.ts?new Date(x.ts.seconds*1000).toLocaleString('vi-VN'):''}</div><pre>${E((x.keys||[]).join('\n'))}</pre></div>`).join('')||'<p class="mu">Chưa có đơn nào.</p>'}
 else if(t=='topup'){v.innerHTML=`<div class="c"><h3>Nạp tiền (VietQR)</h3><input id="a" type="number" placeholder="Số tiền, tối thiểu 10000"><button onclick="tp()">Tạo mã QR</button><div id="qr"></div></div>`}
 else if(t=='admin'&&isAdmin())adm()}
function draw(){const q=($('#q').value||'').toLowerCase();
 $('#g').innerHTML=P.filter(p=>(p.name||'').toLowerCase().includes(q)).map(p=>{const n=(p.keys||[]).length;
 return `<div class="c"><b>${E(p.name)}</b><div class="mu">${E(p.desc||'')}</div><div class="pr">${F(p.price)}</div><div class="mu">Còn: ${n}</div><button style="margin-top:8px;width:100%" ${n?'':'disabled'} onclick="bm('${p.id}')">${n?'Mua':'Hết hàng'}</button></div>`}).join('')||'<p class="mu">Chưa có sản phẩm.</p>'}
function bm(id){if(!U)return auth();const p=P.find(x=>x.id==id);modal(`<h3>${E(p.name)}</h3><p class="pr">${F(p.price)}</p><input id="n" type="number" min="1" value="1"><div class="r"><button onclick="buy('${id}')">Xác nhận mua</button><button class="g" onclick="closeM()">Hủy</button></div><p id="e" style="color:var(--no)"></p>`)}
async function buy(id){const qty=Math.max(1,Math.min(100,+$('#n').value||1));let got=[];
 try{await db.runTransaction(async t=>{
  const pr=db.collection('products').doc(id),ur=db.collection('users').doc(U.id);
  const [p,u]=await Promise.all([t.get(pr),t.get(ur)]);
  if(!p.exists||!p.data().active)throw'Sản phẩm không còn bán';
  const keys=p.data().keys||[];if(keys.length<qty)throw'Không đủ hàng';
  const total=p.data().price*qty;if((u.data().balance||0)<total)throw'Không đủ số dư, hãy nạp thêm';
  got=keys.slice(0,qty);
  t.update(pr,{keys:keys.slice(qty)});t.update(ur,{balance:FV.increment(-total)});
  t.set(db.collection('orders').doc(),{uid:U.id,name:p.data().name,qty,total,keys:got,ts:FV.serverTimestamp()})});
  modal(`<h3>✅ Mua thành công</h3><pre>${E(got.join('\n'))}</pre><button onclick="closeM()">Đóng</button>`);go('shop')
 }catch(e){$('#e').textContent=typeof e=='string'?e:'Lỗi, thử lại'}}
async function tp(){const a=+$('#a').value;if(a<10000)return alert('Nạp tối thiểu 10.000đ');
 const b=(await db.collection('settings').doc('bank').get()).data();if(!b)return alert('Admin chưa cài tài khoản ngân hàng');
 const r=await db.collection('topups').add({uid:U.id,name:U.name||U.id,amount:a,status:'pending',ts:FV.serverTimestamp()});
 const note='NAP'+r.id.slice(0,6).toUpperCase();await r.update({note});
 $('#qr').innerHTML=`<img class="qr" src="https://img.vietqr.io/image/${b.bank}-${b.acc}-compact2.png?amount=${a}&addInfo=${note}&accountName=${encodeURIComponent(b.owner)}"><p>Số tiền: <b>${F(a)}</b><br>Nội dung CK: <b>${note}</b><br>${E(b.bank)} - ${E(b.acc)} - ${E(b.owner)}</p><p class="mu">Chuyển đúng nội dung, admin duyệt xong tiền sẽ vào ví.</p>`}
// ================= ADMIN =================
async function adm(){const v=$('#v');
 const [tp,ps,bk]=await Promise.all([db.collection('topups').where('status','==','pending').get(),db.collection('products').get(),db.collection('settings').doc('bank').get()]);
 const b=bk.data()||{};
 v.innerHTML=`<div class="c"><h3>Đơn nạp chờ duyệt</h3>${tp.docs.map(d=>{const x=d.data();return `<div class="r" style="margin:6px 0"><span>${E(x.name)} · ${F(x.amount)} · ${E(x.note||'')}</span><button class="ok" onclick="ap('${d.id}')">Duyệt</button><button class="no" onclick="ap('${d.id}',1)">Từ chối</button></div>`}).join('')||'<p class="mu">Không có đơn.</p>'}</div>
 <div class="c"><h3>Thêm sản phẩm</h3><input id="pn" placeholder="Tên"><input id="pp" type="number" placeholder="Giá"><input id="pd" placeholder="Mô tả"><textarea id="pk" rows="4" placeholder="Key/nội dung, mỗi dòng 1 cái"></textarea><button onclick="addP()">Thêm</button></div>
 <div class="c"><h3>Sản phẩm</h3>${ps.docs.map(d=>{const x=d.data();return `<div class="c" style="background:#0f1220"><b>${E(x.name)}</b> · ${F(x.price)} · còn ${(x.keys||[]).length} ${x.active?'':'(tắt)'}<textarea id="k_${d.id}" rows="2" placeholder="Nhập thêm key, mỗi dòng 1 cái"></textarea><div class="r"><button onclick="addK('${d.id}')">Nhập kho</button><button class="g" onclick="tgl('${d.id}',${!x.active})">${x.active?'Tắt':'Bật'}</button><button class="no" onclick="delP('${d.id}')">Xóa</button></div></div>`}).join('')}</div>
 <div class="c"><h3>Tài khoản ngân hàng nhận tiền</h3><input id="bb" placeholder="Mã NH (MB, VCB, ACB...)" value="${E(b.bank||'')}"><input id="ba" placeholder="Số tài khoản" value="${E(b.acc||'')}"><input id="bo" placeholder="Chủ tài khoản" value="${E(b.owner||'')}"><button onclick="saveB()">Lưu</button></div>`}
const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
async function addP(){const n=$('#pn').value.trim(),p=+$('#pp').value;if(!n||!(p>0))return alert('Nhập tên và giá');
 await db.collection('products').add({name:n,price:p,desc:$('#pd').value,keys:lines($('#pk').value),active:true});adm()}
async function addK(id){const k=lines($('#k_'+id).value);if(!k.length)return;await db.collection('products').doc(id).update({keys:FV.arrayUnion(...k)});adm()}
async function tgl(id,a){await db.collection('products').doc(id).update({active:a});adm()}
async function delP(id){if(confirm('Xóa sản phẩm này?')){await db.collection('products').doc(id).delete();adm()}}
async function saveB(){await db.collection('settings').doc('bank').set({bank:$('#bb').value.trim(),acc:$('#ba').value.trim(),owner:$('#bo').value.trim()});alert('Đã lưu')}
async function ap(id,rej){try{await db.runTransaction(async t=>{const r=db.collection('topups').doc(id),d=await t.get(r);
 if(!d.exists||d.data().status!=='pending')throw'Đơn đã xử lý';
 if(rej)t.update(r,{status:'rejected'});else{t.update(r,{status:'approved'});t.update(db.collection('users').doc(d.data().uid),{balance:FV.increment(d.data().amount)})}})}catch(e){alert(e)}adm()}
init();
</script></body></html>
