<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop Key</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#100e1c;--sf:#1a1730;--ln:#2e2852;--tx:#f2effa;--mu:#9a94b8;--ac:#f5b942;--ok:#4ade9b;--no:#ff6b7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px}
.brand svg{width:24px;height:24px;color:var(--ac)}
.wal{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:5px 5px 5px 13px}
.wal small{color:var(--mu);font-size:12px}.wal b{color:var(--ac);font-variant-numeric:tabular-nums}
.wal button{padding:5px 11px;font-size:12px;border-radius:999px}
.w{max-width:620px;margin:auto;padding:14px 14px 100px}
h3{margin:0 0 10px;font-size:18px}
button{font:inherit;font-weight:700;background:var(--ac);color:#1b1304;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
button:active{transform:scale(.97)}
button.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}
button.ok{background:var(--ok);color:#06251a}button.no{background:var(--no);color:#2a0509}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);margin:5px 0;font:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--ac)}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:12px}
.mu{color:var(--mu);font-size:13px}
.list{background:var(--sf);border:1px solid var(--ln);border-radius:16px;overflow:hidden;margin-top:10px}
.pd{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px}
.pd+.pd{border-top:1px solid var(--ln)}
.pi{display:flex;flex-direction:column;gap:3px;min-width:0}.pi b{font-size:16px}
.pa{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.pr{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;color:var(--ac)}
.st{font-size:12px;color:var(--ok)}.st.low{color:var(--ac)}.st.out{color:var(--no)}
.empty{text-align:center;color:var(--mu);padding:36px 12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 4px 9px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--ac)}
.chips{display:flex;gap:8px;margin:8px 0 12px}.chips button{flex:1;padding:8px 0;font-size:13px}
.m{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:9}
.m>div{background:var(--sf);border:1px solid var(--ln);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:88vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.m>div{animation:none}}
pre{background:var(--bg);border:1px dashed var(--ln);color:var(--ac);padding:10px;border-radius:10px;white-space:pre-wrap;word-break:break-all;user-select:all;font:13px ui-monospace,Menlo,monospace;margin:8px 0}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}
img.qr{display:block;width:100%;max-width:260px;margin:12px auto;border-radius:12px;background:#fff;padding:8px}
</style></head><body>
<header><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg>Shop Key</div><div id="hd"></div></header>
<div class="w"><div id="v"></div></div><nav id="tb"></nav>
<div class="m" id="m"><div id="mc"></div></div>
<script>
// ====== CẤU HÌNH: dán firebaseConfig của mày vào đây ======
const firebaseConfig={apiKey:"AIzaSyCPoZuP5xjMQZQhHZL3FMNGyhXcbcgWfpk",authDomain:"clone-gia-re.firebaseapp.com",projectId:"clone-gia-re",storageBucket:"clone-gia-re.firebasestorage.app",messagingSenderId:"1023948939436",appId:"1:1023948939436:web:dc1965cf4416ade10f3f09"};
const ADMINS=["8618983578"];          // Telegram ID admin
// ===========================================================
firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),FV=firebase.firestore.FieldValue;
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const $=s=>document.querySelector(s),F=n=>Number(n||0).toLocaleString('vi-VN')+'đ',E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let U=null,P=[],TAB='shop';
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const isAdmin=()=>U&&ADMINS.includes(U.tgid||'');
function modal(h){$('#mc').innerHTML=h;$('#m').style.display='flex'}function closeM(){$('#m').style.display='none'}
$('#m').onclick=e=>{if(e.target.id=='m')closeM()};
async function init(){
 if(!firebaseConfig.projectId){hd();tabs();return showErr('thiếu config')}
 try{
 const t=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
 if(t){await load('tg_'+t.id,{name:t.first_name||t.username||'User',tgid:String(t.id)})}
 else{const s=localStorage.getItem('uid');if(s)await load(s)}
 }catch(e){hd();tabs();return showErr(e)}
 hd();tabs();go('shop')}
async function load(id,extra){const r=db.collection('shop_users').doc(id);let d=await r.get();
 if(!d.exists){await r.set({balance:0,created:FV.serverTimestamp(),...(extra||{})});d=await r.get()}
 U={id,...d.data()};r.onSnapshot(s=>{if(s.exists){U={id,...s.data()};hd()}})}
function hd(){$('#hd').innerHTML=U?`<div class="wal"><small>Ví</small><b>${F(U.balance)}</b>${tg?'':'<button class="g" onclick="out()">Thoát</button>'}</div>`:`<button onclick="auth()">Đăng nhập</button>`}
function tabs(){const T=[['shop','🛍️','Cửa hàng'],['orders','📦','Đơn của tôi'],['topup','💳','Nạp tiền']];if(isAdmin())T.push(['admin','⚙️','Admin']);
 $('#tb').innerHTML=T.map(x=>`<button class="${TAB==x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}
function out(){localStorage.removeItem('uid');U=null;hd();tabs();go('shop')}
function auth(){modal(`<h3>Đăng nhập / Đăng ký</h3><input id="u" placeholder="Tên đăng nhập"><input id="p" type="password" placeholder="Mật khẩu (≥6 ký tự)"><button style="width:100%" onclick="sub()">Vào</button><p id="e" style="color:var(--no)"></p>`)}
async function sub(){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;
 if(!/^[a-z0-9_]{3,20}$/.test(u)||p.length<6)return $('#e').textContent='Tên 3-20 ký tự a-z0-9_, mật khẩu ≥ 6 ký tự';
 const id='u_'+u,h=await sha(p),r=db.collection('shop_users').doc(id),d=await r.get();
 if(d.exists){if(d.data().pw!==h)return $('#e').textContent='Sai mật khẩu'}else await r.set({balance:0,pw:h,name:u,created:FV.serverTimestamp()});
 localStorage.setItem('uid',id);await load(id);closeM();hd();tabs();go(TAB)}
async function go(t){TAB=t;tabs();try{await go0(t)}catch(e){showErr(e)}}
function showErr(e){const m=String(e&&e.message||e),c=e&&e.code||'';let h='';
 if(!firebaseConfig.projectId)h='Chưa dán firebaseConfig vào file index.html (đang để trống).';
 else if(/permission|insufficient/i.test(c+m))h='Firestore đang chặn truy cập. Vào Firebase → Firestore Database → Rules, đổi thành <code>allow read, write: if true;</code> rồi Publish.';
 else if(/offline|unavailable/i.test(c+m))h='Không kết nối được Firestore. Kiểm tra mạng, hoặc chưa tạo Firestore Database trong project.';
 else h='Lỗi không rõ.';
 $('#v').innerHTML='<div class="c"><b style="color:var(--no)">Không tải được dữ liệu</b><p>'+h+'</p><pre>'+E(c+' '+m)+'</pre></div>'}
async function go0(t){TAB=t;const v=$('#v');
 if(t=='shop'){v.innerHTML='Đang tải...';const s=await db.collection('shop_products').where('active','==',true).get();
  P=s.docs.map(d=>({id:d.id,...d.data()}));
  v.innerHTML=`<input id="q" placeholder="Tìm sản phẩm..." oninput="draw()"><div class="list" id="g"></div>`;draw()}
 else if(!U)auth();
 else if(t=='orders'){const s=await db.collection('shop_orders').where('uid','==',U.id).get();
  const o=s.docs.map(d=>d.data()).sort((a,b)=>(b.ts?.seconds||0)-(a.ts?.seconds||0));
  v.innerHTML=o.map(x=>`<div class="c"><div class="r" style="align-items:flex-start"><div><b>${E(x.name)}</b> ×${x.qty}<div class="mu">${x.ts?new Date(x.ts.seconds*1000).toLocaleString('vi-VN'):''}</div></div><b class="pr" style="flex:none;text-align:right">${F(x.total)}</b></div><pre>${E((x.keys||[]).join('\n'))}</pre><button class="g" onclick="cp(this)">Sao chép</button></div>`).join('')||'<div class="empty">Bạn chưa mua gì.<br>Chọn một sản phẩm ở tab Cửa hàng.</div>'}
 else if(t=='topup'){v.innerHTML=`<div class="c"><h3>Nạp tiền</h3><div class="mu">Chọn hoặc nhập số tiền, quét mã QR để chuyển khoản.</div><div class="chips">${[20000,50000,100000,200000].map(n=>`<button class="g" onclick="$('#a').value=${n}">${n/1000}k</button>`).join('')}</div><input id="a" type="number" placeholder="Số tiền (tối thiểu 10.000đ)"><button style="width:100%;margin-top:6px" onclick="tp()">Tạo mã QR</button><div id="qr"></div></div>`}
 else if(t=='admin'&&isAdmin())adm()}
function draw(){const q=($('#q').value||'').toLowerCase();
 $('#g').innerHTML=P.filter(p=>(p.name||'').toLowerCase().includes(q)).map(p=>{const n=(p.keys||[]).length,c=n==0?'out':n<=5?'low':'';
 return `<div class="pd"><div class="pi"><b>${E(p.name)}</b>${p.desc?`<span class="mu">${E(p.desc)}</span>`:''}<span class="st ${c}">${n?'Còn '+n:'Hết hàng'}</span></div><div class="pa"><div class="pr">${F(p.price)}</div><button ${n?'':'disabled'} onclick="bm('${p.id}')">Mua</button></div></div>`}).join('')||'<div class="empty">Chưa có sản phẩm nào.<br>Quay lại sau nhé.</div>'}
function cp(b){navigator.clipboard.writeText((b.closest('.c,.m>div').querySelector('pre')).innerText).then(()=>{b.textContent='Đã sao chép';setTimeout(()=>b.textContent='Sao chép',1500)})}
function bm(id){if(!U)return auth();const p=P.find(x=>x.id==id);modal(`<h3>${E(p.name)}</h3><p class="pr">${F(p.price)}</p><input id="n" type="number" min="1" value="1"><div class="r"><button onclick="buy('${id}')">Xác nhận mua</button><button class="g" onclick="closeM()">Hủy</button></div><p id="e" style="color:var(--no)"></p>`)}
async function buy(id){const qty=Math.max(1,Math.min(100,+$('#n').value||1));let got=[];
 try{await db.runTransaction(async t=>{
  const pr=db.collection('shop_products').doc(id),ur=db.collection('shop_users').doc(U.id);
  const [p,u]=await Promise.all([t.get(pr),t.get(ur)]);
  if(!p.exists||!p.data().active)throw'Sản phẩm không còn bán';
  const keys=p.data().keys||[];if(keys.length<qty)throw'Không đủ hàng';
  const total=p.data().price*qty;if((u.data().balance||0)<total)throw'Không đủ số dư, hãy nạp thêm';
  got=keys.slice(0,qty);
  t.update(pr,{keys:keys.slice(qty)});t.update(ur,{balance:FV.increment(-total)});
  t.set(db.collection('shop_orders').doc(),{uid:U.id,name:p.data().name,qty,total,keys:got,ts:FV.serverTimestamp()})});
  modal(`<h3>✅ Mua thành công</h3><pre>${E(got.join('\n'))}</pre><div class="r"><button class="g" onclick="cp(this)">Sao chép</button><button onclick="closeM()">Đóng</button></div>`);go('shop')
 }catch(e){$('#e').textContent=typeof e=='string'?e:'Lỗi, thử lại'}}
async function tp(){const a=+$('#a').value;if(a<10000)return alert('Nạp tối thiểu 10.000đ');
 const b=(await db.collection('shop_settings').doc('bank').get()).data();if(!b)return alert('Admin chưa cài tài khoản ngân hàng');
 const r=await db.collection('shop_topups').add({uid:U.id,name:U.name||U.id,amount:a,status:'pending',ts:FV.serverTimestamp()});
 const note='NAP'+r.id.slice(0,6).toUpperCase();await r.update({note});
 $('#qr').innerHTML=`<img class="qr" onerror="this.outerHTML='<p style=color:var(--no)>Không tạo được ảnh QR (mã ngân hàng sai?). Hãy chuyển khoản thủ công theo thông tin bên dưới.</p>'" src="https://img.vietqr.io/image/${E(b.bank)}-${E(b.acc)}-compact2.png?amount=${a}&addInfo=${note}&accountName=${encodeURIComponent(b.owner)}"><p>Số tiền: <b>${F(a)}</b><br>Nội dung CK: <b>${note}</b><br>${E(b.bank)} - ${E(b.acc)} - ${E(b.owner)}</p><p class="mu">Chuyển đúng nội dung, admin duyệt xong tiền sẽ vào ví.</p>`}
// ================= ADMIN =================
async function adm(){const v=$('#v');
 const [tp,ps,bk]=await Promise.all([db.collection('shop_topups').where('status','==','pending').get(),db.collection('shop_products').get(),db.collection('shop_settings').doc('bank').get()]);
 const b=bk.data()||{};
 v.innerHTML=`<div class="c"><h3>Đơn nạp chờ duyệt</h3>${tp.docs.map(d=>{const x=d.data();return `<div class="r" style="margin:6px 0"><span>${E(x.name)} · ${F(x.amount)} · ${E(x.note||'')}</span><button class="ok" onclick="ap('${d.id}')">Duyệt</button><button class="no" onclick="ap('${d.id}',1)">Từ chối</button></div>`}).join('')||'<p class="mu">Không có đơn.</p>'}</div>
 <div class="c"><h3>Thêm sản phẩm</h3><input id="pn" placeholder="Tên"><input id="pp" type="number" placeholder="Giá"><input id="pd" placeholder="Mô tả"><textarea id="pk" rows="4" placeholder="Key/nội dung, mỗi dòng 1 cái"></textarea><button onclick="addP()">Thêm</button></div>
 <div class="c"><h3>Sản phẩm</h3>${ps.docs.map(d=>{const x=d.data();return `<div class="c" style="background:var(--bg)"><b>${E(x.name)}</b> · ${F(x.price)} · còn ${(x.keys||[]).length} ${x.active?'':'(tắt)'}<textarea id="k_${d.id}" rows="2" placeholder="Nhập thêm key, mỗi dòng 1 cái"></textarea><div class="r"><button onclick="addK('${d.id}')">Nhập kho</button><button class="g" onclick="tgl('${d.id}',${!x.active})">${x.active?'Tắt':'Bật'}</button><button class="no" onclick="delP('${d.id}')">Xóa</button></div></div>`}).join('')}</div>
 <div class="c"><h3>Tài khoản ngân hàng nhận tiền</h3><input id="bb" placeholder="Mã NH: MB, VCB, ACB, TCB... (hoặc BIN 970422)" value="${E(b.bank||'')}"><input id="ba" placeholder="Số tài khoản" value="${E(b.acc||'')}"><input id="bo" placeholder="Chủ tài khoản" value="${E(b.owner||'')}"><button onclick="saveB()">Lưu</button></div>`}
const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
async function addP(){const n=$('#pn').value.trim(),p=+$('#pp').value;if(!n||!(p>0))return alert('Nhập tên và giá');
 await db.collection('shop_products').add({name:n,price:p,desc:$('#pd').value,keys:lines($('#pk').value),active:true});adm()}
async function addK(id){const k=lines($('#k_'+id).value);if(!k.length)return;await db.collection('shop_products').doc(id).update({keys:FV.arrayUnion(...k)});adm()}
async function tgl(id,a){await db.collection('shop_products').doc(id).update({active:a});adm()}
async function delP(id){if(confirm('Xóa sản phẩm này?')){await db.collection('shop_products').doc(id).delete();adm()}}
async function saveB(){await db.collection('shop_settings').doc('bank').set({bank:$('#bb').value.trim(),acc:$('#ba').value.trim(),owner:$('#bo').value.trim()});alert('Đã lưu')}
async function ap(id,rej){try{await db.runTransaction(async t=>{const r=db.collection('shop_topups').doc(id),d=await t.get(r);
 if(!d.exists||d.data().status!=='pending')throw'Đơn đã xử lý';
 if(rej)t.update(r,{status:'rejected'});else{t.update(r,{status:'approved'});t.update(db.collection('shop_users').doc(d.data().uid),{balance:FV.increment(d.data().amount)})}})}catch(e){alert(e)}adm()}
init();
</script></body></html>
