 else if(extra){const o=d.data(),ch={};for(const k in extra)if(extra[k]!==undefined&&o[k]!==extra[k])ch[k]=extra[k];
  if(Object.keys(ch).length){await r.update(ch);d=await r.get()}}
 U={id,...d.data()};if(unsub)unsub();unsub=r.onSnapshot(s=>{if(s.exists){U={id,...s.data()};hd()}})}

const gm=x=>String(x||'').trim().toLowerCase(),isGm=x=>/^[a-z0-9._+-]+@gmail\.com$/.test(x);

async function regSend(re){const e=$('#e');let em,p;
 if(re)em=RG.email;else{em=gm($('#em').value);p=$('#p').value;
  if(!isGm(em))return e.textContent='Hãy nhập đúng Gmail (đuôi @gmail.com)';

 e.textContent='Đang gửi mã...';
 try{

  authUI();toast('Đã gửi mã tới Gmail')

 try{
  await mailApi({action:'verify_otp',email:RG.email,code:c});
  const id='e_'+RG.email,r=db.collection('shop_users').doc(id);
  if((await r.get()).exists)return e.textContent='Gmail này đã đăng ký';
  await r.set({balance:0,pw:RG.pw,pwv:2,email:RG.email,emailVerified:true,name:RG.email.split('@')[0],banned:false,created:FV.serverTimestamp()});
  tgNotify('reg',{who:RG.email,via:'Web'});RG=null;localStorage.setItem('uid',id);await load(id);closeM();hd();tabs();go(TAB);toast('Tạo tài khoản thành công')
 }catch(x){e.textContent=typeof x=='string'?x:'Lỗi, thử lại'}}
async function sub(){const e=$('#e'),a=gm($('#em').value),p=$('#p').value;
 if(!a||!p)return e.textContent='Nhập đầy đủ thông tin';
 const em=a.includes('@');
 if(em&&!isGm(a))return e.textContent='Gmail không hợp lệ';
 if(!em&&!/^[a-z0-9_]{3,20}$/.test(a))return e.textContent='Tên đăng nhập không hợp lệ';
 try{
  const id=(em?'e_':'u_')+a,d=await db.collection('shop_users').doc(id).get();
  if(!d.exists)return e.textContent=em?'Gmail chưa đăng ký, hãy chuyển sang Đăng ký':'Tài khoản không tồn tại';
  const x=d.data(),h=x.pwv==2?await sha('v2:'+a+':'+p):await sha(p);
  if(x.pw!==h)return e.textContent='Sai mật khẩu';
  if(x.banned)return e.textContent='Tài khoản đã bị khóa';
  localStorage.setItem('uid',id);await load(id);closeM();hd();tabs();go(TAB)
 }catch(x){e.textContent='Lỗi kết nối, thử lại'}}

 if(!firebaseConfig.projectId)h='Chưa dán firebaseConfig vào file index.html (đang để trống).';
 else if(/permission|insufficient/i.test(c+m))h='Firestore đang chặn truy cập. Vào Firebase → Firestore Database → Rules, đổi thành <code>allow read, write: if true;</code> rồi Publish.';
 else if(/offline|unavailable/i.test(c+m))h='Không kết nối được Firestore. Kiểm tra mạng, hoặc chưa tạo Firestore Database trong project.';
 else h='Lỗi không rõ.';
 $('#v').innerHTML='<div class="c"><b style="color:var(--no)">Không tải được dữ liệu</b><p>'+h+'</p><pre>'+E(c+' '+m)+'</pre></div>'}

 if(t=='shop'){v.innerHTML='<div class="empty">Đang tải kho hàng...</div>';const s=await db.collection('shop_products').where('active','==',true).get();
  P=s.docs.map(d=>({id:d.id,...d.data()}));PF='';

  <div class="kv"><div><small>Số dư</small><b>${F(U.balance)}</b></div><div><small>${U.tgid?'Telegram ID':'Tài khoản'}</small><b style="font-size:14px;color:var(--bl)">${E(U.tgid||U.email||U.id)}</b></div></div>

  <div class="r"><button class="bt s" style="flex:1" onclick="cpt('${E(U.tgid||U.email||U.id)}')">Sao chép ID</button><button class="bt gd s" style="flex:1" onclick="go('topup')">Nạp tiền</button></div>
  <button class="bt g" style="margin-top:10px" onclick="showRedeem()">Nhập mã giảm giá / Giftcode</button>
  ${inTG?'':'<button class="bt g" style="margin-top:10px;color:var(--no);border-color:var(--no)" onclick="out()">⎋ Đăng xuất</button>'}</div>`}
 else if(!U)auth();
 else if(t=='orders'){if(OV=='all')return feed();const s=await db.collection('shop_orders').where('uid','==',U.id).get();
  const o=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts?.seconds||0)-(a.ts?.seconds||0));

 else if(t=='topup'){v.innerHTML=`<div class="hero"><h2>Nạp Tiền</h2><div class="mu">Chuyển khoản qua mã QR, admin duyệt là có tiền.</div></div>

function op(id){const p=P.find(x=>x.id==id);if(!p)return;const L=norm(p).filter(x=>sk(x)>0);if(!L.length)return toast('Hết hàng');const f=L[0];SEL={p,pid:f.id,q:1};sh()}
function sp(pid){SEL.pid=pid;SEL.q=1;sh()}
function sh(){const {p,pid}=SEL,L=norm(p).filter(x=>sk(x)>0||x.id==pid),pl=L.find(x=>x.id==pid)||L[0],mx=Math.max(1,Math.min(100,sk(pl)));SEL.q=Math.max(1,Math.min(mx,SEL.q));
 const fr=!(pl.price>0);
 modal(`<div class="sh-h">${imgBox(p.img,'ico big')}<div style="min-width:0"><h3>${E(p.name)}</h3><span class="plat">${IC.chip}<span>${E(p.platform||'Sản phẩm')}</span></span></div></div>
 ${p.desc?`<p class="mu" style="margin:0 0 6px">${E(p.desc)}</p>`:''}
 ${L[0]&&L[0].legacy?'':`<div class="lb" style="margin-top:4px">Chọn gói</div>`}

  if(!d.exists||d.data().status!=='pending')throw'Đơn đã xử lý';
  if(rej)t.update(r,{status:'rejected'});else{t.update(r,{status:'approved'});t.update(db.collection('shop_users').doc(d.data().uid),{balance:FV.increment(d.data().amount)})}});done=true}catch(e){return false}
 if(done&&!rej){try{const d=(await db.collection('shop_topups').doc(id).get()).data();await logBal(d.uid,d.amount,'topup','Nạp tiền duyệt #'+id.slice(0,6),U.id);
  const ud=(await db.collection('shop_users').doc(d.uid).get()).data();if(ud&&ud.email)mailNotify('topup_ok',{amount:d.amount,note:d.note||''},ud.email)}catch(e){}}
 return done}
async function ap(id,rej){if(!(await apOne(id,rej)))alert('Đơn đã xử lý');adm('tp')}
async function apAll(rej,exp){const s=await db.collection('shop_topups').where('status','==','pending').get();
 const l=s.docs.filter(d=>{const old=Date.now()-tsMs(d.data())>=QRTTL;return exp?old:!old});
 if(!l.length)return toast('Không có đơn nào');
 const tot=l.reduce((a,d)=>a+(+d.data().amount||0),0);
 if(!confirm((rej?'TỪ CHỐI ':'DUYỆT ')+l.length+' đơn nạp, tổng '+F(tot)+'?'))return;
 toast('Đang xử lý '+l.length+' đơn...');let ok=0;
 for(const d of l){if(await apOne(d.id,rej))ok++}
 toast('Xong: '+ok+'/'+l.length+' đơn');adm('tp')}
// ---- Lịch sử mua/nạp của mọi người ----
const mk=n=>Array.from(String(n||'Ẩn danh')).slice(0,2).join('')+'***';
const ago=ms=>{const m=Math.max(0,Math.floor((Date.now()-ms)/60000));return m<1?'vừa xong':m<60?m+' phút trước':m<1440?Math.floor(m/60)+' giờ trước':Math.floor(m/1440)+' ngày trước'};
function ovSeg(){return `<div class="seg"><button class="${OV=='mine'?'on':''}" onclick="ov('mine')">Của tôi</button><button class="${OV=='all'?'on':''}" onclick="ov('all')">Mọi người</button></div>`}
function ov(x){OV=x;go('orders')}
async function feed(){const v=$('#v'),head=`<div class="hero"><h2>Lịch Sử</h2><div class="mu">Mua và nạp gần đây của mọi người.</div></div>${ovSeg()}`;
 v.innerHTML=head+'<div class="empty">Đang tải...</div>';
 const [o,t]=await Promise.all([db.collection('shop_orders').orderBy('ts','desc').limit(40).get(),db.collection('shop_topups').orderBy('ts','desc').limit(60).get()]);
 const A=[...o.docs.map(d=>({k:'buy',...d.data()})),...t.docs.map(d=>({k:'top',...d.data()})).filter(x=>x.status==='approved')].filter(x=>x.ts).sort((a,b)=>tsMs(b)-tsMs(a)).slice(0,50);
 await Promise.all([...new Set(A.filter(x=>x.k=='buy'&&!NC[x.uid]).map(x=>x.uid))].map(async u=>{try{NC[u]=((await db.collection('shop_users').doc(u).get()).data()||{}).name||'Ẩn danh'}catch(e){NC[u]='Ẩn danh'}}));
 const nm=x=>{const n=x.k=='buy'?NC[x.uid]:x.name;return isAdm(x.uid)?`<span class="fn">${E(n)}</span>${VT}`:`<span class="fn">${E(mk(n))}</span>`};
 v.innerHTML=head+`<div class="c" style="padding-top:6px;padding-bottom:6px">${A.map(x=>x.k=='buy'
  ?`<div class="row"><div class="inf"><div style="white-space:normal">${nm(x)} <span class="mu">đã mua</span></div><span class="mu" style="display:block;white-space:normal">${E(x.name)}${x.plan?' · '+E(x.plan):''} ×${x.qty} · ${ago(tsMs(x))}</span></div><b style="flex:none;color:var(--gd)">${x.total>0?'-'+F(x.total):'Miễn phí'}</b></div>`
  :`<div class="row"><div class="inf"><div style="white-space:normal">${nm(x)} <span class="mu">đã nạp</span></div><span class="mu" style="display:block">Nạp tiền vào ví · ${ago(tsMs(x))}</span></div><b style="flex:none;color:#2ee59d">+${F(x.amount)}</b></div>`).join('')||'<div class="empty"><b>Chưa có hoạt động nào</b></div>'}</div>`}
function addCode(){modal(`<h3>Tạo Giftcode</h3>
 <label class="lb">Mã (viết hoa)</label><input id="cc" placeholder="VD: SALE50K" style="text-transform:uppercase">
 <label class="lb">Số tiền cộng vào ví</label><input id="ca" type="number" placeholder="50000">
 <label class="lb">Chỉ dùng 1 lần?</label><select id="co" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:#091328;color:var(--tx)"><option value="1">Có - chỉ 1 người dùng</option><option value="0">Không - nhiều người dùng được</option></select>
 <label class="lb">Hết hạn (để trống = không hết hạn)</label><input id="ce" type="date">
 <div class="r" style="margin-top:14px"><button class="bt gd" onclick="saveCode()">Tạo</button><button class="bt g" onclick="closeM()">Hủy</button></div><p id="e" class="err"></p>`)}
async function saveCode(){const code=($('#cc').value||'').trim().toUpperCase(),amt=+$('#ca').value,once=$('#co').value=='1',exp=$('#ce').value;
 if(!code||code.length<3)return $('#e').textContent='Mã tối thiểu 3 ký tự';if(amt<=0)return $('#e').textContent='Số tiền phải > 0';
 const data={code,amount:amt,once,used:0,users:[],created:FV.serverTimestamp()};
 if(exp)data.expire=firebase.firestore.Timestamp.fromDate(new Date(exp+'T23:59:59'));
 try{await db.collection('shop_codes').add(data);closeM();toast('Đã tạo mã '+code);adm('cd')}catch(e){$('#e').textContent='Lỗi: '+(e.message||e)}}
async function delCode(id){if(!confirm('Xóa mã này?'))return;await db.collection('shop_codes').doc(id).delete();adm('cd')}
init();
</script></body></html>
