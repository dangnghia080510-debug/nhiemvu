async function sitetopShorten(long){
 let url="",why="";
 try{

 }catch(e){why=e.message||String(e)}

async function newTask(){
  await loadCfg();if(CFG.mt&&!isAd())return shell();
  if(CFG.lim>0&&today()>=CFG.lim)return toast(`Hôm nay đã làm đủ ${CFG.lim} nhiệm vụ`,0);
  const left=Math.ceil((CFG.cd*1e3-(Date.now()-ME.last))/1e3);if(left>0)return toast(`Nghỉ thêm ${left}s`,0);
  $("#nt").disabled=true;
  const key=rnd(12);
  const long=`${LAG}?vlpcode=${key}&vlpsid=${rnd(16)}&vlpuser=${U.uid}&vlpitem=task&vlpround=1&vlpts=${Date.now()}&vlpmin=${CFG.wait}`;
  let url="",why="";
  try{
    const sk=(await getDoc(doc(db,"settings","secret"))).data()?.k;
    if(!sk){toast("Admin chưa nhập API key sitetop",0);return go("task")}
    const api=`https://sitetop.net/api?api=${sk}&url=${encodeURIComponent(long)}`;
    const r=await fetch(`${WORKER}?url=${encodeURIComponent(api)}`);
    const t=await r.text();
    if(!t||!t.trim().startsWith("{"))throw new Error("Worker lỗi: "+(t||"").slice(0,60));
    const j=JSON.parse(t);
    url=j.shortenedUrl||j.short_url||j.shorturl||j.shortUrl||j.url||j.link||(j.data&&(j.data.shortenedUrl||j.data.short_url||j.data.url))||"";
    why=j.message||j.error||j.msg||"";
  }catch(e){why=e.message||String(e)}
  if(!url||url===long||url.startsWith(LAG)){toast("Không tạo được link"+(why?": "+why:""),0);return go("task")}
  await addDoc(collection(db,"tasks"),{uid:U.uid,kh:await sha(key+":"+U.uid),url,status:"pending",created:Date.now(),dev:DEV,opened:0,fails:0});
  go("task");
}
async function flag(why,hard){
 // hard = bằng chứng bypass rõ ràng -> khóa ngay. Vi phạm nhẹ thì cộng dồn tới ngưỡng CFG.sus
 if(isAd())return 0;
 let ban=0;
 try{await runTransaction(db,async tx=>{const r=doc(db,"users",U.uid),x=await tx.get(r),u=x.data(),n=(u.sus||0)+1,d={sus:n,susWhy:why,susAt:Date.now()};
  ban=!!hard||(CFG.sus>0&&n>=CFG.sus);if(ban)d.banned=true;tx.update(r,d)})}catch{ban=0}
 if(ban){ME.banned=true;ME.sus=(ME.sus||0)+1;if(hard)localStorage.bn=U.uid;NOTIFY("lock",(ME.name||"?")+" bị khóa tự động\nLý do: "+why);toast("Phát hiện bypass, tài khoản đã bị khóa",0);shell()}
 return ban;
}
async function sendKey(t){
 await loadMe();await loadCfg();if(CFG.mt&&!isAd())return shell();
 if((ME.lockUntil||0)>Date.now())return toast(`Đang bị khóa nhập key ${Math.ceil((ME.lockUntil-Date.now())/6e4)} phút`,0);
 const k=$("#k").value.trim().toUpperCase();
 if(!k)return toast("Dán key vào ô trước",0);
 if(t.dev&&t.dev!==DEV){if(await flag("Nhập key từ thiết bị khác"))return;return toast("Nhiệm vụ này phải làm trên thiết bị đã nhận",0)}
 const good=await sha(k+":"+U.uid)===t.kh;
 if(!t.opened){if(good&&!t.openFail){await flag("Có key đúng nhưng chưa từng bấm Mở link (nghi bypass)",1);return}return toast("Hãy bấm nút Mở link nhiệm vụ trước",0)}
 const used=Date.now()-t.opened;
 if(used<CFG.wait*1e3){
  const left=Math.ceil((CFG.wait*1e3-used)/1e3);
  // gửi key đúng nhưng quá nhanh = dấu hiệu bypass
  if(good){await flag("Có key đúng nhưng chưa đủ "+CFG.wait+"s (nhanh "+Math.round(used/1e3)+"s)",1);return}
  return toast(`Chưa đủ thời gian vượt link, chờ thêm ${left}s`,0)}
 if(!good){
  let n=(t.fails||0)+1,lock=0;
  try{await updateDoc(doc(db,"tasks",t.id),{fails:n,status:n>=CFG.mf?"failed":"pending"})}catch{}
  if(n>=CFG.mf){lock=Date.now()+CFG.ml*6e4;if(await flag("Sai key "+n+" lần"))return;try{await updateDoc(doc(db,"users",U.uid),{lockUntil:lock})}catch{}
   toast(`Sai quá ${CFG.mf} lần, nhiệm vụ bị hủy và khóa nhập key ${CFG.ml} phút`,0);return go("task")}
  t.fails=n;return toast(`Key sai (còn ${CFG.mf-n} lần)`,0)}
 try{await runTransaction(db,async tx=>{const tr=doc(db,"tasks",t.id),ur=doc(db,"users",U.uid),[ts,us]=[await tx.get(tr),await tx.get(ur)];
  const td=ts.data();if(td.status!=="pending"||!td.opened||Date.now()-td.opened<CFG.wait*1e3)throw 1;
  const u=us.data(),d=day();
  if(u.banned)throw 1;
  if(CFG.lim>0&&(u.dayKey===d?u.dayCount:0)>=CFG.lim)throw 2;
  if(Date.now()-(u.last||0)<CFG.cd*1e3*0.5)throw 3;
  const nt=(u.total||0)+1,due=!!u.ref&&!u.refPaid&&nt>=RN();
  const rs=due?await tx.get(doc(db,"users",u.ref)):null;
  const upd={balance:u.balance+CFG.tien,total:nt,dayKey:d,dayCount:(u.dayKey===d?u.dayCount:0)+1,last:Date.now()};
  if(due){
   const rd=rs.exists()?rs.data():null,ok=!!rd&&!rd.banned&&CFG.refbonus>0&&(!u.dev||rd.dev!==u.dev);
   upd.refPaid=true;upd.refVoid=!ok;
   if(ok)tx.update(rs.ref,{balance:(rd.balance||0)+CFG.refbonus,refEarn:(rd.refEarn||0)+CFG.refbonus});
  }
  tx.update(tr,{status:"done",done:Date.now()});
  tx.update(ur,upd)})}
 catch(e){return toast(e===2?"Đã đủ nhiệm vụ hôm nay":e===3?"Làm quá nhanh, thử lại sau":"Nhiệm vụ không hợp lệ hoặc đã dùng",0)}
 toast("+"+fmt(CFG.tien));go("task");
}

 const draw=()=>{
  const bm=wmode==="bank";
  m.innerHTML=`<div class="card"><h2>Rút tiền</h2>
  <p class="mu">Số dư ${fmt(ME.balance)} · Tối thiểu ${fmt(bm?CFG.minb:CFG.min)}</p>

  m.querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>{wmode=b.dataset.md;draw()});
  m.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{selCard=b.dataset.c;m.querySelectorAll("[data-c]").forEach(x=>x.classList.toggle("on",x.dataset.c===selCard))});
  m.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{selDenom=+b.dataset.d;m.querySelectorAll("[data-d]").forEach(x=>x.classList.toggle("on",+x.dataset.d===selDenom))});
  m.querySelectorAll("[data-bk]").forEach(b=>b.onclick=e=>{if(e.target.closest("[data-del]"))return;selBank=b.dataset.bk;m.querySelectorAll("[data-bk]").forEach(x=>x.classList.toggle("on",x.dataset.bk===selBank))});
  m.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("Xóa tài khoản này?"))return;try{await deleteDoc(doc(db,"banks",b.dataset.del));toast("Đã xóa")}catch{toast("Không xóa được",0)}go("doi")});
  if($("#badd"))$("#badd").onclick=()=>{showAdd=true;draw()};
  if($("#bcn"))$("#bcn").onclick=()=>{showAdd=false;draw()};

   if(!bank||!/^\d{6,20}$/.test(number)||owner.length<3)return toast("Nhập đủ ngân hàng, số tài khoản (6-20 số) và tên chủ tài khoản",0);
   if(bk.length>=MAXBANK)return toast("Tối đa "+MAXBANK+" tài khoản",0);
   try{await addDoc(collection(db,"banks"),{uid:U.uid,bank,number,owner,created:Date.now()});toast("Đã lưu tài khoản")}catch{toast("Không lưu được",0)}
   go("doi")};
  if($("#wd"))$("#wd").onclick=async e=>{
   const btn=e.currentTarget;
   await loadCfg();if(CFG.mt&&!isAd())return shell();
   if(wmode==="bank"){
    const b=bk.find(x=>x.id===selBank);if(!b)return toast("Chọn tài khoản ngân hàng",0);
    const amt=num($("#am").value);
    if(amt<CFG.minb)return toast("Tối thiểu "+fmt(CFG.minb),0);
    if(amt>ME.balance)return toast("Số dư không đủ",0);
    btn.disabled=true;
    await addDoc(collection(db,"withdrawals"),{uid:U.uid,uname:ME.name,type:"bank",amount:amt,bank:b.bank,bankNo:b.number,bankOwner:b.owner,status:"pending",created:Date.now()});
    NOTIFY("wd",ME.name+" rút ngân hàng "+fmt(amt)+"\n"+b.bank+" · "+b.number+" · "+b.owner);toast("Đã gửi yêu cầu rút "+fmt(amt));
   }else{
    if(selDenom<CFG.min)return toast("Tối thiểu "+fmt(CFG.min),0);
    if(selDenom>ME.balance)return toast("Số dư không đủ",0);
    btn.disabled=true;
    await addDoc(collection(db,"withdrawals"),{uid:U.uid,uname:ME.name,type:"card",amount:selDenom,card:selCard,status:"pending",created:Date.now()});
    NOTIFY("wd",ME.name+" đổi thẻ "+selCard+" "+fmt(selDenom));toast("Đã gửi yêu cầu "+selCard+" "+fmt(selDenom));
   }
   go("doi");
  };
 };
 draw();
}

const wheelCfg=()=>{const w=Array.isArray(CFG.wheel)?CFG.wheel.filter(s=>s&&+s.w>0&&+s.a>=0).map(s=>({a:+s.a,w:+s.w})):[];return w.length>=2?w.slice(0,12):DEF.wheel};
const kfmt=n=>n>=1e6?+(n/1e6).toFixed(1)+"M":n>=1e3?+(n/1e3).toFixed(1)+"K":n>0?n+"đ":"Trượt";
const pick=ws=>{const t=ws.reduce((a,b)=>a+b,0),a=new Uint32Array(1);crypto.getRandomValues(a);let r=a[0]/4294967296*t;for(let i=0;i<ws.length;i++){if((r-=ws[i])<0)return i}return ws.length-1};
async function pSpin(m){
 await loadMe();hdr();
 if(!CFG.spinOn&&!isAd()){m.innerHTML='<div class="card"><h2>Vòng quay</h2><p class="mu">Vòng quay đang tạm tắt.</p></div>';return}
 const W=wheelCfg(),N=W.length,cost=+CFG.spinCost||0,lim=+CFG.spinLim||0,sig=JSON.stringify([W,cost,lim]);
 const used=()=>ME.spinDay===day()?(ME.spinN||0):0;
 m.innerHTML=`<div class="card" style="text-align:center"><h2>Vòng quay Nguyệt Ma</h2><p class="mu">Mỗi lượt <b>${fmt(cost)}</b>${lim>0?` · Hôm nay <b id="sl"></b>/${lim} lượt`:""}</p>
 <div class="wh"><i class="ptr"></i><canvas id="wc" width="640" height="640"></canvas><i class="hub">☾</i></div>
 <button class="btn" id="sp">Quay · ${fmt(cost)}</button></div>
 <div class="card"><h2>Các ô thưởng</h2><div class="chips">${[...new Set(W.map(s=>s.a))].sort((a,b)=>a-b).map(a=>`<span class="tag pending">${a?fmt(a):"Trượt"}</span>`).join("")}</div></div>
 <div class="card"><h2>Lịch sử quay</h2><div id="sh"><p class="mu">Đang tải...</p></div></div>`;
 const cv=$("#wc"),g=cv.getContext("2d"),R=320,st=2*Math.PI/N,P=["#4c1d95","#be185d","#6d28d9","#9d174d","#5b21b6","#a21caf"];
 W.forEach((x,i)=>{const a0=-Math.PI/2+i*st;g.beginPath();g.moveTo(R,R);g.arc(R,R,R-6,a0,a0+st);g.closePath();g.fillStyle=x.a===0?"#1f1a33":P[i%P.length];g.fill();g.strokeStyle="#f0c969";g.lineWidth=3;g.stroke();
  g.save();g.translate(R,R);g.rotate(a0+st/2);g.textAlign="right";g.textBaseline="middle";g.fillStyle="#fff7e0";g.font="700 34px 'Be Vietnam Pro',sans-serif";g.fillText(kfmt(x.a),R-30,0);g.restore()});
 const sl=()=>{if($("#sl"))$("#sl").textContent=used()};sl();
 const hist=async()=>{let l=[];try{l=(await rows(query(collection(db,"spins"),where("uid","==",U.uid)))).sort((a,b)=>b.t-a.t).slice(0,10)}catch{}
  if($("#sh"))$("#sh").innerHTML=l.map(x=>`<div class="item"><span class="mu">${new Date(x.t).toLocaleString("vi-VN")}</span><b>${x.a?"+"+fmt(x.a):"Trượt"}</b></div>`).join("")||'<p class="mu">Chưa có lượt quay nào.</p>'};
 hist();
 let rot=0,busy=0;
 $("#sp").onclick=async()=>{
  if(busy)return;busy=1;const b=$("#sp");b.disabled=true;
  await loadCfg();
  if(JSON.stringify([wheelCfg(),+CFG.spinCost||0,+CFG.spinLim||0])!==sig){busy=0;toast("Vòng quay vừa được cập nhật",0);return pSpin(m)}
  if(!CFG.spinOn&&!isAd()){busy=0;return pSpin(m)}
  const idx=pick(W.map(x=>x.w));
  try{await runTransaction(db,async tx=>{const r=doc(db,"users",U.uid),x=await tx.get(r),u=x.data(),d=day(),n=u.spinDay===d?(u.spinN||0):0;
   if(u.banned)throw"Tài khoản đang bị khóa";
   if(lim>0&&n>=lim)throw"Hôm nay đã hết lượt quay";
   if((u.balance||0)<cost)throw"Số dư không đủ";
   tx.update(r,{balance:u.balance-cost+W[idx].a,spinDay:d,spinN:n+1})})}
  catch(e){busy=0;b.disabled=false;return toast(typeof e==="string"?e:"Không quay được: "+(e.code||e.message),0)}
  rot=360*(Math.floor(rot/360)+6)-(idx+.5+(Math.random()-.5)*.7)*(360/N);
  cv.style.transform=`rotate(${rot}deg)`;
  await sleep(4700);
  await loadMe();hdr();sl();
  const a=W[idx].a;toast(a?"Trúng "+fmt(a)+"!":"Trượt rồi, chúc may mắn lần sau",a>=cost);
  try{await addDoc(collection(db,"spins"),{uid:U.uid,a,cost,t:Date.now()})}catch{}
  hist();busy=0;b.disabled=false};
}

async function creditLink(btn,x,v){
 btn.disabled=true;
 try{
  await runTransaction(db,async tx=>{
   const lr=doc(db,"links",x.id),ur=doc(db,"users",x.uid),ls=await tx.get(lr),us=await tx.get(ur);
   if(!ls.exists()||!us.exists())throw"Không tìm thấy link hoặc người dùng";
   const l=ls.data(),u=us.data();
   tx.update(ur,{balance:(u.balance||0)+v});
   tx.update(lr,{earned:(l.earned||0)+v,n:(l.n||0)+1});
   tx.set(doc(collection(db,"credits")),{uid:x.uid,uname:l.uname,lid:x.id,short:l.short,amount:v,created:Date.now()})});
  toast("Đã cộng "+fmt(v)+" cho "+x.uname);
  NOTIFY("credit","Cộng "+fmt(v)+" cho "+x.uname+"\nTừ link: "+x.short);
 }catch(e){toast(typeof e==="string"?e:"Không cộng được: "+(e.code||e.message),0)}
 pAdmin()}

async function pLink(m){
 await loadMe();hdr();
 const[ls,cs]=await Promise.all([rows(query(collection(db,"links"),where("uid","==",U.uid))),rows(query(collection(db,"credits"),where("uid","==",U.uid)))]);
 const L=ls.sort((a,b)=>b.created-a.created),C=cs.sort((a,b)=>b.created-a.created);
 const tot=L.reduce((a,l)=>a+(l.earned||0),0),lim=+CFG.linkLim||0,used=ME.linkDay===day()?(ME.linkN||0):0;
 const cut=x=>String(x||"").length>46?String(x).slice(0,43)+"...":String(x||"");
 m.innerHTML=`<div class="card"><h2>Rút gọn link</h2>
 <p class="mu" style="margin-bottom:12px">Dán link của bạn để tạo link rút gọn. Mỗi link chỉ rút gọn được <b>1 lần</b>, không nhận link sitetop.net. Khi link có thu nhập, admin sẽ cộng tiền vào ví theo từng link.${lim>0?` Hôm nay: <b>${used}/${lim}</b> lượt.`:""}</p>
 <label>Link gốc</label><input id="lu" inputmode="url" placeholder="https://..." autocomplete="off">
 <button class="btn" id="lb">Rút gọn link</button></div>
 <div class="card"><h2>Link của bạn</h2><div class="stat"><div><b>${L.length}</b><span>Số link</span></div><div><b>${fmt(tot)}</b><span>Đã được cộng</span></div><div><b>${C.length}</b><span>Lần cộng</span></div></div>
 ${L.map(l=>`<div class="hi"><div class="top"><span><b style="word-break:break-all">${esc(l.short)}</b><br><span class="mu">${esc(cut(l.orig))} · ${new Date(l.created).toLocaleDateString("vi-VN")}</span></span><span class="tag ${l.earned>0?"approved":"pending"}">${l.earned>0?"+"+fmt(l.earned):"Chưa có"}</span></div><button class="mini" data-cp="${esc(l.short)}" style="margin-top:8px">Copy link</button></div>`).join("")||'<p class="mu">Chưa có link nào.</p>'}</div>
 <div class="card"><h2>Lịch sử cộng tiền</h2>${C.slice(0,30).map(c=>`<div class="hi"><div class="top"><span><b>+${fmt(c.amount)}</b><br><span class="mu">Cộng từ link rút gọn ${esc(cut(c.short))}<br>${new Date(c.created).toLocaleString("vi-VN")}</span></span><span class="tag approved">Đã cộng</span></div></div>`).join("")||'<p class="mu">Chưa có khoản nào được cộng.</p>'}</div>`;
 bindCp(m);
 $("#lb").onclick=async()=>{
  const b=$("#lb"),v=cleanUrl($("#lu").value);
  if(v.err)return toast(v.err,0);
  b.disabled=true;
  try{
   await loadCfg();if(CFG.mt&&!isAd())return shell();
   await loadMe();
   const lm=+CFG.linkLim||0;
   if(lm>0&&!isAd()&&(ME.linkDay===day()?(ME.linkN||0):0)>=lm)throw"Hôm nay đã hết lượt rút gọn link";
   const id=await sha(v.norm);
   if((await getDoc(doc(db,"links",id))).exists())throw"Link này đã được rút gọn rồi, không thể rút gọn lại";
   const r=await sitetopShorten(v.url);
   if(!r.url)throw"Không tạo được link"+(r.why?": "+r.why:"");
   await runTransaction(db,async tx=>{
    const lr=doc(db,"links",id),ur=doc(db,"users",U.uid),lx=await tx.get(lr),ux=await tx.get(ur);
    if(lx.exists())throw"Link này đã được rút gọn rồi, không thể rút gọn lại";
    const u=ux.data();if(u.banned)throw"Tài khoản đang bị khóa";
    const d=day(),n=u.linkDay===d?(u.linkN||0):0;
    if(lm>0&&!isAd()&&n>=lm)throw"Hôm nay đã hết lượt rút gọn link";
    tx.set(lr,{uid:U.uid,uname:ME.name,orig:v.url,short:r.url,earned:0,n:0,created:Date.now()});
    tx.update(ur,{linkDay:d,linkN:n+1})});
   NOTIFY("link",ME.name+" vừa rút gọn link\n"+r.url+"\nGốc: "+v.url);
   toast("Đã rút gọn link");go("link");
  }catch(e){b.disabled=false;toast(typeof e==="string"?e:"Lỗi: "+(e.code||e.message),0)}
 };
}

async function pAdmin(m=$("#m")){
 if(!isAd())return;await loadCfg();
 const[wd,us,rg,sc,hd,lk]=await Promise.all([rows(query(collection(db,"withdrawals"),where("status","==","pending"))),rows(query(collection(db,"users"),orderBy("created","desc"),limit(300))),rows(query(collection(db,"users"),where("approved","==",false))),getDoc(doc(db,"settings","secret")),rows(query(collection(db,"withdrawals"),where("status","in",["approved","rejected"]))),rows(query(collection(db,"links"),orderBy("created","desc"),limit(100)))]);
 const all=[...new Map([...rg,...us].map(u=>[u.id,u])).values()],dup=u=>u.dev?all.filter(x=>x.dev===u.dev).length:1;
 const pr=rg.filter(u=>!u.banned).sort((a,b)=>a.created-b.created);
 const wl=wd.sort((a,b)=>a.created-b.created).map(w=>{const b=isBank(w);return`<div class="wr" data-t="${b?"bank":"card"}">
  <div style="margin-bottom:10px"><b>${esc(w.uname)}</b> · ${fmt(w.amount)} <span class="tag pending">${b?"Ngân hàng":"Thẻ "+esc(w.card||"?")}</span><br><span class="mu">${new Date(w.created).toLocaleString("vi-VN")}</span></div>
  ${b?`<div class="box"><span class="mu">Chuyển khoản tới</span><br><b>${esc(w.bank)}</b><br>STK: <b>${esc(w.bankNo)}</b> <button class="mini" data-cp="${esc(w.bankNo)}">Copy</button><br>Chủ TK: <b>${esc(w.bankOwner)}</b><br><span class="mu">Chuyển xong mới bấm Duyệt, ví sẽ tự trừ ${fmt(w.amount)}.</span></div>`
  :`<input data-cc placeholder="Mã thẻ" autocomplete="off"><input data-cs placeholder="Số seri" autocomplete="off">`}
  <div class="row"><button class="mini ok" data-ok="${w.id}">Duyệt</button><button class="mini bad" data-no="${w.id}">Từ chối</button></div></div>`}).join("");
 m.innerHTML=`<div class="card" style="${CFG.mt?"border:2px solid #f0c969":""}"><h2>Bảo trì ${CFG.mt?'<span class="tag approved">ĐANG BẬT</span>':'<span class="tag pending">Đang tắt</span>'}</h2><p class="mu" style="margin-bottom:10px">Khi bật, người dùng (trừ admin) chỉ thấy màn hình bảo trì.</p><label>Nội dung thông báo bảo trì</label><textarea id="mtm" rows="2">${esc(CFG.mtmsg)}</textarea><button class="btn ${CFG.mt?"alt":""}" id="mtb">${CFG.mt?"Tắt bảo trì":"Bật bảo trì"}</button></div>
 <div class="card"><h2>Chờ duyệt tài khoản (${pr.length})</h2>${pr.map(u=>`<div class="item"><span><b>${esc(u.name)}</b><br><span class="mu">${new Date(u.created).toLocaleString("vi-VN")}</span>${dup(u)>1?`<br><span class="tag pending">${dup(u)} tk cùng máy</span>`:""}</span><span><button class="mini ok" data-ap="${u.id}">Duyệt</button> <button class="mini bad" data-rj="${u.id}">Từ chối</button></span></div>`).join("")||'<p class="mu">Không có.</p>'}</div>
 <div class="card"><h2>Đơn rút / đổi thẻ chờ duyệt (${wd.length})</h2>${wl||'<p class="mu">Không có.</p>'}</div>
 <div class="card"><h2>Lịch sử đơn đã xử lý (${hd.length})</h2><div class="fl" id="hf"><button data-f="all" class="on">Tất cả</button><button data-f="card">Thẻ</button><button data-f="bank">Ngân hàng</button><button data-f="rejected">Từ chối</button></div><div id="hl"></div></div>
 <div class="card" id="wcard"></div>
 <div class="card"><h2>Link rút gọn của người dùng (${lk.length})</h2><p class="mu" style="margin-bottom:10px">Cộng tiền theo từng link. Người dùng sẽ thấy khoản tiền này trong lịch sử, kèm link rút gọn.</p><input id="lq" placeholder="Tìm theo tên hoặc link..." autocomplete="off" style="margin-bottom:8px"><div id="ll"></div></div>
 <div class="card"><h2>Cài đặt</h2>${Object.keys(SET).map(k=>`<label>${SET[k]}</label><input data-s="${k}" inputmode="numeric" value="${CFG[k]}">`).join("")}
 ${Object.keys(CT).map(k=>`<label>${CT[k]}</label><input data-t="${k}" value="${esc(CFG[k]||"")}">`).join("")}
 <label>API key sitetop</label><input id="sk" type="password" placeholder="${sc.exists()&&sc.data().k?"Đã lưu":"Dán API key"}">
 <label>Telegram bot token (lấy từ @BotFather)</label><input id="tgt" type="password" placeholder="${sc.exists()&&sc.data().tg?"Đã lưu":"Dán token bot"}" autocomplete="off">
 <label>Telegram chat id của admin</label><input id="tgc" inputmode="numeric" placeholder="${sc.exists()&&sc.data().tgc?"Đã lưu":"VD: 123456789"}" autocomplete="off">
 <button class="btn alt" id="tgb" style="margin-bottom:12px">Gửi thử Telegram (bấm Lưu trước)</button>
 <label>Thông báo</label><textarea id="an" rows="2">${esc(CFG.ann)}</textarea>
 <button class="btn" id="sv">Lưu</button></div>
 <div class="card"><h2>Người dùng (${us.length})</h2>
 <div class="srch"><input id="uq" placeholder="Tìm theo tên người dùng..." autocomplete="off" style="margin-bottom:8px"></div>
 <div class="fl" id="uf"><button data-f="all" class="on">Tất cả</button><button data-f="ban">Đã khóa</button><button data-f="sus">Nghi bypass</button><button data-f="top">Nhiều xu nhất</button></div>
 <div id="ul"></div></div>`;
 bindCp(m);
 m.querySelectorAll("[data-ap]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"users",b.dataset.ap),{approved:true});NOTIFY("acc","Đã duyệt tài khoản "+(all.find(u=>u.id===b.dataset.ap)?.name||""));toast("Đã duyệt");pAdmin()});
 m.querySelectorAll("[data-rj]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"users",b.dataset.rj),{banned:true});NOTIFY("ban","Từ chối (khóa) tài khoản "+(all.find(u=>u.id===b.dataset.rj)?.name||""));toast("Đã từ chối");pAdmin()});
 m.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{
  const bx=b.closest(".wr"),x={};
  if(bx.dataset.t==="card"){
   x.code=bx.querySelector("[data-cc]").value.trim();x.serial=bx.querySelector("[data-cs]").value.trim();
   if(!x.code||!x.serial)return toast("Nhập mã thẻ và số seri trước khi duyệt",0);
  }
  b.disabled=true;decide(b.dataset.ok,1,x)});
 m.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>{const r=prompt("Lý do từ chối (có thể bỏ trống):");if(r===null)return;b.disabled=true;decide(b.dataset.no,0,{reason:r.trim()})});
 let uf="all";
 const drawU=()=>{
  const q=$("#uq").value.trim().toLowerCase();
  let l=us.filter(u=>!q||((u.name||"")+" "+(u.phone||"")).toLowerCase().includes(q));
  if(uf==="ban")l=l.filter(u=>u.banned);
  if(uf==="sus")l=l.filter(u=>(u.sus||0)>0);
  if(uf==="top")l=[...l].sort((a,b)=>(b.balance||0)-(a.balance||0));
  $("#ul").innerHTML=l.map(u=>{const me=u.id===U.uid;return`<div class="us"><div class="nm">${u.banned?"🚫 ":u.approved===false?"⏳ ":""}${esc(u.name)} ${me?'<span class="tag pending">Bạn</span>':""}${(u.sus||0)>0?`<span class="tag rejected">Nghi bypass ×${u.sus}</span>`:""}</div>
   <div class="mu">${u.phone&&u.phone!==u.name?"SĐT <b>"+esc(u.phone)+"</b><br>":!u.phone?"Chưa có SĐT<br>":""}Số dư <b>${fmt(u.balance)}</b> · ${u.total||0} nhiệm vụ · ${dup(u)>1?dup(u)+" tk cùng máy · ":""}${u.banned?"Đang bị khóa":"Đang hoạt động"}${u.susWhy?`<br>Lý do nghi: ${esc(u.susWhy)}`:""}</div>
   ${me?"":`<div class="ac"><input inputmode="numeric" data-amt placeholder="Số tiền"><button class="mini ok" data-add="${u.id}">+ Cộng</button><button class="mini bad" data-sub="${u.id}">− Trừ</button><button class="mini ${u.banned?"ok":"bad"}" data-b="${u.id}" data-v="${u.banned?0:1}">${u.banned?"Mở khóa":"Khóa"}</button>${(u.sus||0)>0||u.lockUntil>Date.now()?`<button class="mini" data-clr="${u.id}">Xóa cờ</button>`:""}</div>`}</div>`}).join("")||'<p class="mu">Không tìm thấy.</p>';
  $("#ul").querySelectorAll("[data-b]").forEach(b=>b.onclick=async()=>{const ban=b.dataset.v==="1";if(ban&&!confirm("Khóa tài khoản này?"))return;await updateDoc(doc(db,"users",b.dataset.b),ban?{banned:true}:{banned:false,sus:0,lockUntil:0});NOTIFY("ban",(ban?"Đã khóa tài khoản ":"Đã mở khóa tài khoản ")+(us.find(u=>u.id===b.dataset.b)?.name||""));toast(ban?"Đã khóa":"Đã mở khóa");pAdmin()});
  $("#ul").querySelectorAll("[data-clr]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"users",b.dataset.clr),{sus:0,susWhy:"",lockUntil:0});toast("Đã xóa cờ");pAdmin()});
  const adj=sign=>b=>b.onclick=async()=>{
   const v=num(b.closest(".ac").querySelector("[data-amt]").value)*sign;if(!v)return toast("Nhập số tiền hợp lệ",0);
   const id=b.dataset.add||b.dataset.sub;
   try{await runTransaction(db,async tx=>{const r=doc(db,"users",id),x=await tx.get(r);if(x.data().balance+v<0)throw 1;tx.update(r,{balance:x.data().balance+v})});NOTIFY("adj",(v>0?"Cộng ":"Trừ ")+fmt(Math.abs(v))+" cho "+(us.find(u=>u.id===id)?.name||""));toast((v>0?"Đã cộng ":"Đã trừ ")+fmt(Math.abs(v)))}catch{toast("Số dư không đủ để trừ",0)}pAdmin()};
  $("#ul").querySelectorAll("[data-add]").forEach(adj(1));$("#ul").querySelectorAll("[data-sub]").forEach(adj(-1));
 };
 $("#uq").oninput=drawU;
 $("#uf").querySelectorAll("button").forEach(b=>b.onclick=()=>{uf=b.dataset.f;$("#uf").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));drawU()});
 drawU();
 let hfl="all";
 const hs=[...hd].sort((a,b)=>(b.done||b.created)-(a.done||a.created));
 const hsum=t=>hd.filter(w=>w.status==="approved"&&(t==="bank"?isBank(w):!isBank(w))).reduce((a,w)=>a+w.amount,0);
 const drawH=()=>{
  let l=hs;if(hfl==="card")l=l.filter(w=>!isBank(w));else if(hfl==="bank")l=l.filter(isBank);else if(hfl==="rejected")l=l.filter(w=>w.status==="rejected");
  $("#hl").innerHTML=`<p class="mu" style="margin-bottom:8px">Đã chi: thẻ <b>${fmt(hsum("card"))}</b> · ngân hàng <b>${fmt(hsum("bank"))}</b></p>`+(l.slice(0,50).map(w=>{const b=isBank(w);return`<div class="hi"><div class="top"><span><b>${esc(w.uname)}</b> · ${fmt(w.amount)}<br><span class="mu">${b?"Ngân hàng "+esc(w.bank||""):"Thẻ "+esc(w.card||"?")} · ${new Date(w.done||w.created).toLocaleString("vi-VN")}</span></span><span class="tag ${w.status}">${ST[w.status]}</span></div>${w.reason?`<p class="mu" style="margin-top:6px">Lý do: ${esc(w.reason)}</p>`:""}</div>`}).join("")||'<p class="mu">Không có.</p>');
 };
 $("#hf").querySelectorAll("button").forEach(b=>b.onclick=()=>{hfl=b.dataset.f;$("#hf").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));drawH()});
 drawH();
 const drawL=()=>{
  const q=$("#lq").value.trim().toLowerCase();
  const l=lk.filter(x=>!q||((x.uname||"")+" "+(x.orig||"")+" "+(x.short||"")).toLowerCase().includes(q));
  $("#ll").innerHTML=l.slice(0,50).map(x=>`<div class="wr"><div style="margin-bottom:8px"><b>${esc(x.uname)}</b> <span class="tag ${x.earned>0?"approved":"pending"}">Đã cộng ${fmt(x.earned||0)}${x.n?" · "+x.n+" lần":""}</span><br><span class="mu">${new Date(x.created).toLocaleString("vi-VN")}</span></div>
   <div class="box"><span class="mu">Link rút gọn</span><br><b style="word-break:break-all">${esc(x.short)}</b> <button class="mini" data-cp="${esc(x.short)}">Copy</button><br><span class="mu">Link gốc</span><br><span style="word-break:break-all">${esc(x.orig)}</span></div>
   <div class="row" style="align-items:center"><input inputmode="numeric" data-la placeholder="Số tiền cộng (đ)" style="margin:0"><button class="mini ok" data-lc="${x.id}" style="flex:none">+ Cộng tiền</button></div></div>`).join("")||'<p class="mu">Chưa có link nào.</p>';
  bindCp($("#ll"));
  $("#ll").querySelectorAll("[data-lc]").forEach(b=>b.onclick=()=>{
   const x=lk.find(z=>z.id===b.dataset.lc),v=num(b.closest(".wr").querySelector("[data-la]").value);
   if(!x)return;if(!v)return toast("Nhập số tiền hợp lệ",0);
   if(!confirm("Cộng "+fmt(v)+" cho "+x.uname+" từ link này?"))return;
   creditLink(b,x,v)});
 };
 $("#lq").oninput=drawL;drawL();
 let wsl=wheelCfg().map(x=>({...x})),sOn=CFG.spinOn?1:0,sCost=+CFG.spinCost||0,sLim=+CFG.spinLim||0;
 const wc=$("#wcard");
 const rd=()=>{sOn=num(wc.querySelector("#wo").value)?1:0;sCost=num(wc.querySelector("#wcst").value);sLim=num(wc.querySelector("#wlim").value);
  const A=[...wc.querySelectorAll("[data-wa]")],B=[...wc.querySelectorAll("[data-ww]")];wsl=A.map((a,i)=>({a:num(a.value),w:num(B[i].value)}))};
 const evH=()=>{const tot=wsl.reduce((a,x)=>a+x.w,0)||1,ev=Math.round(wsl.reduce((a,x)=>a+x.a*x.w,0)/tot);return`Trung bình mỗi lượt trả lại <b>${fmt(ev)}</b> / thu <b>${fmt(sCost)}</b> → admin <b>${ev>sCost?"LỖ":"lời"} ${fmt(Math.abs(sCost-ev))}</b>/lượt.`};
 const drawW=()=>{
  const tot=wsl.reduce((a,x)=>a+x.w,0)||1;
  wc.innerHTML=`<h2>Vòng quay</h2><div class="row"><div><label>Bật (1) / Tắt (0)</label><input id="wo" inputmode="numeric" value="${sOn}"></div><div><label>Giá/lượt (đ)</label><input id="wcst" inputmode="numeric" value="${sCost}"></div><div><label>Lượt/ngày (0=∞)</label><input id="wlim" inputmode="numeric" value="${sLim}"></div></div>
  <label>Các ô: tiền trúng (đ) · tỉ lệ (số lớn = dễ trúng) · %</label>
  ${wsl.map((x,i)=>`<div class="row" style="align-items:center;margin-bottom:8px"><input data-wa inputmode="numeric" value="${x.a}" style="margin:0"><input data-ww inputmode="numeric" value="${x.w}" style="margin:0"><span class="mu" data-wp style="flex:none;width:50px">${(x.w/tot*100).toFixed(1)}%</span><button class="mini bad" data-wx="${i}" style="flex:none">Xóa</button></div>`).join("")}
  <button class="btn alt" id="wadd" style="margin:6px 0 12px">+ Thêm ô</button>
  <p class="note" id="wev">${evH()}</p><button class="btn" id="wsv">Lưu vòng quay</button>`;
  wc.oninput=()=>{rd();const t=wsl.reduce((a,x)=>a+x.w,0)||1;wc.querySelector("#wev").innerHTML=evH();wc.querySelectorAll("[data-wp]").forEach((p,i)=>p.textContent=(wsl[i].w/t*100).toFixed(1)+"%")};
  wc.querySelector("#wadd").onclick=()=>{rd();if(wsl.length>=12)return toast("Tối đa 12 ô",0);wsl.push({a:1000,w:5});drawW()};
  wc.querySelectorAll("[data-wx]").forEach(b=>b.onclick=()=>{rd();if(wsl.length<=2)return toast("Tối thiểu 2 ô",0);wsl.splice(+b.dataset.wx,1);drawW()});
  wc.querySelector("#wsv").onclick=async()=>{rd();if(wsl.some(x=>x.w<=0))return toast("Tỉ lệ mỗi ô phải lớn hơn 0",0);
   try{await setDoc(doc(db,"settings","main"),{wheel:wsl,spinOn:sOn,spinCost:sCost,spinLim:sLim},{merge:true});toast("Đã lưu vòng quay");pAdmin()}catch(e){toast("Không lưu được: "+(e.code||e.message),0)}};
 };
 drawW();
 $("#tgb").onclick=async()=>{TG=null;const g=await tgCfg();if(!g.t||!g.c)return toast("Chưa lưu token hoặc chat id",0);NOTIFY("test","Bot hoạt động bình thường");toast("Đã gửi thử, kiểm tra Telegram")};
 $("#mtb").onclick=async()=>{if(!CFG.mt&&!confirm("Bật bảo trì? Người dùng sẽ không vào được."))return;await setDoc(doc(db,"settings","main"),{mt:CFG.mt?0:1,mtmsg:$("#mtm").value.trim()},{merge:true});toast(CFG.mt?"Đã tắt bảo trì":"Đã bật bảo trì");pAdmin()};
 $("#sv").onclick=async()=>{const b=$("#sv");b.disabled=true;try{const d={ann:$("#an").value.trim()};m.querySelectorAll("input[data-s]").forEach(i=>d[i.dataset.s]=num(i.value));m.querySelectorAll("input[data-t]").forEach(i=>d[i.dataset.t]=i.value.trim());await setDoc(doc(db,"settings","main"),d,{merge:true});const k=$("#sk").value.trim(),tk=$("#tgt").value.trim(),tc=$("#tgc").value.trim(),sd={};if(k)sd.k=k;if(tk)sd.tg=tk;if(tc)sd.tgc=tc;if(Object.keys(sd).length){await setDoc(doc(db,"settings","secret"),sd,{merge:true});TG=null}toast("Đã lưu");pAdmin()}catch(e){b.disabled=false;console.error(e);toast("Không lưu được: "+(e.code||e.message),0)}};
}
async function decide(id,ok,x={}){
 let info=null;
 try{
  await runTransaction(db,async tx=>{
   const wr=doc(db,"withdrawals",id),w=await tx.get(wr);
   if(!w.exists()||w.data().status!=="pending")throw"Đã xử lý";
   const d=w.data(),upd={status:ok?"approved":"rejected",done:Date.now()};info=d;
   if(ok){
    const ur=doc(db,"users",d.uid),u=await tx.get(ur);
    if(u.data().balance<d.amount)throw"Ví người dùng không đủ tiền";
    tx.update(ur,{balance:u.data().balance-d.amount});
    if(x.code){upd.cardCode=x.code;upd.cardSerial=x.serial}
   }else if(x.reason){upd.reason=x.reason;
   }
   tx.update(wr,upd);
  });
  if(info)NOTIFY("wdone",(ok?"Đã duyệt":"Đã từ chối")+" đơn "+(isBank(info)?"ngân hàng "+info.bank:"thẻ "+info.card)+" "+fmt(info.amount)+"\nNgười dùng: "+info.uname+(x.reason?"\nLý do: "+x.reason:""));
  toast(ok?"Đã duyệt, đã trừ tiền trong ví":"Đã từ chối");
 }catch(e){toast(typeof e==="string"?e:"Lỗi",0)}
 pAdmin();
}
</script></body></html>
