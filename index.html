<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vượt Link Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<!--
FIRESTORE RULES (Firebase Console > Firestore > Rules) - bật Authentication > Email/Password trước:
rules_version='2'; service cloud.firestore{ match /databases/{d}/documents{
 function ad(){return request.auth!=null&&request.auth.token.email=='admin@vl.app'}
 function own(){return request.auth!=null&&resource.data.uid==request.auth.uid}
 function mine(){return request.auth!=null&&request.resource.data.uid==request.auth.uid}
 function ok(){return get(/databases/$(d)/documents/users/$(request.auth.uid)).data.get('approved',true)!=false}
 match /settings/{x}{allow read:if true;allow write:if ad()}
 match /users/{u}{allow read:if request.auth!=null;
  allow create:if request.auth.uid==u&&request.resource.data.balance==0&&request.resource.data.banned==false&&request.resource.data.approved==false;
  allow update:if ad()||(request.auth.uid==u&&ok()&&request.resource.data.banned==resource.data.banned&&request.resource.data.get('approved',null)==resource.data.get('approved',null))}
 match /tasks/{t}{allow read,update:if ad()||own();allow create:if mine()&&ok()}
 match /banks/{b}{allow read,delete:if ad()||own();allow create:if mine()&&ok()}
 match /withdrawals/{w}{allow read:if ad()||own();allow create:if mine()&&ok()&&request.resource.data.status=='pending';allow update:if ad()}
}}
LƯU Ý: web thuần Firebase thì người dùng rành kỹ thuật vẫn có thể sửa số dư của chính họ. Muốn chặn hẳn phải dùng Cloud Functions.
Đăng ký tài khoản tên "admin" ĐẦU TIÊN để làm quản trị viên.
-->
<style>
:root{--ink:#0b0a1e;--pan:#17143a;--pan2:#1f1b4d;--line:#34306e;--cy:#19e3ff;--mg:#ff2e9a;--gold:#ffc832;--ok:#3dff9a;--bad:#ff4d6d;--tx:#ecebff;--mu:#9b98cf}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:500 17px/1.4 Rajdhani,system-ui,sans-serif;background:radial-gradient(900px 500px at 85% -10%,#3a1470 0,transparent 60%),radial-gradient(700px 400px at -10% 30%,#07406a 0,transparent 60%),var(--ink) fixed}
h1,h2,.coin,.btn,nav button{font-family:Orbitron,sans-serif}
h2{font-size:15px;margin:0 0 12px;color:var(--cy);letter-spacing:.04em}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.logo{font:800 18px Orbitron;color:var(--tx)}.logo i{font-style:normal;color:var(--mg)}
.coin{background:var(--pan);border:1px solid var(--gold);color:var(--gold);padding:6px 12px;border-radius:999px;font-size:14px;box-shadow:0 0 14px #ffc83033}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.hero{background:linear-gradient(135deg,var(--pan2),#2a1559);border-color:var(--mg);box-shadow:0 0 28px #ff2e9a22}
.hero .big{font:800 38px Orbitron;color:var(--gold);text-shadow:0 0 18px #ffc83066;margin:2px 0 10px}
.xp{height:14px;background:#0b0a1e;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.xp b{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg));transition:width .6s}
.mu{color:var(--mu)}
input,select,textarea{width:100%;margin:0 0 10px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--cy),#5b7cff);color:#04041a;font-weight:800;font-size:13px;cursor:pointer;letter-spacing:.03em}
.btn:active{transform:scale(.98)}.btn.alt{background:var(--pan2);color:var(--tx);border:1px solid var(--line)}
.btn.mg{background:linear-gradient(90deg,var(--mg),#ff7a45);color:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.mini{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--pan2);color:var(--tx);font:inherit;cursor:pointer}
.mini.bad{color:var(--bad)}.mini.ok{color:var(--ok)}
.tag{padding:2px 10px;border-radius:999px;font-size:14px;border:1px solid}
.pending{color:var(--gold)}.approved{color:var(--ok)}.rejected{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d0b28f2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;padding:14px 4px;border:0;background:none;color:var(--mu);font-size:11px;cursor:pointer}
nav button.on{color:var(--cy);box-shadow:inset 0 3px var(--cy)}
.auth{max-width:380px;margin:12vh auto 0}.auth h1{font-size:26px;margin:0 0 4px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);padding:11px 18px;border-radius:10px;font-weight:700;z-index:9;max-width:92vw;background:var(--pan2);border:1px solid}
.toast.ok{border-color:var(--ok);color:var(--ok)}.toast.bad{border-color:var(--bad);color:var(--bad)}
.rk{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rk .n{width:34px;font:800 16px Orbitron;color:var(--gold)}.rk.me{background:#19e3ff14}
.rk .c{margin-left:auto;font-family:Orbitron;color:var(--cy)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="wrap" id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,query,where,orderBy,limit,getDocs,runTransaction}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyCPoZuP5xjMQZQhHZL3FMNGyhXcbcgWfpk",authDomain:"clone-gia-re.firebaseapp.com",projectId:"clone-gia-re",storageBucket:"clone-gia-re.firebasestorage.app",messagingSenderId:"1023948939436",appId:"1:1023948939436:web:9e905a63107caefc0f3f09"});
const auth=getAuth(app),db=getFirestore(app);

// ====== CẤU HÌNH ======
const SHORT_KEY="DAN_API_KEY_SITETOP_VAO_DAY"; // lưu ý: key đặt ở web thì ai cũng xem được
const LAG="https://dangnghia080510-debug.github.io/fake-lag/";
const BANKS=["MB Bank","Vietcombank","Techcombank","ACB","BIDV","VPBank","Agribank","VietinBank","TPBank","Sacombank"];
const DEF={tien:250,min:20000,exp:20,wait:45,lim:20,cd:30,ann:""};
const SET={tien:"Tiền mỗi nhiệm vụ (đ)",min:"Tối thiểu rút (đ)",exp:"Key hết hạn (phút)",wait:"Vượt link tối thiểu (giây)",lim:"Giới hạn nhiệm vụ/ngày (0 = không giới hạn)",cd:"Nghỉ giữa 2 nhiệm vụ (giây)"};
const ST={pending:"Chờ duyệt",approved:"Đã duyệt",rejected:"Từ chối"};

// ====== TIỆN ÍCH ======
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("vi-VN")+"đ";
const num=s=>parseInt(String(s).replace(/\D/g,""))||0;
const day=()=>new Date(Date.now()+252e5).toISOString().slice(0,10);
const rnd=n=>{const a=new Uint32Array(n);crypto.getRandomValues(a);return[...a].map(x=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[x%32]).join("")};
const DEV=localStorage.dv||(localStorage.dv=rnd(16));
const ERR={"auth/email-already-in-use":"Tên này đã có người dùng. Nếu là bạn, hãy bấm Đăng nhập","auth/operation-not-allowed":"Firebase chưa bật Email/Password: vào Authentication > Sign-in method để bật","permission-denied":"Firestore đang chặn: dán Rules ở đầu file rồi bấm Publish","auth/network-request-failed":"Mất mạng, thử lại","auth/weak-password":"Mật khẩu quá yếu, đặt từ 6 ký tự"};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const toast=(m,ok=1)=>{const t=document.createElement("div");t.className="toast "+(ok?"ok":"bad");t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)};
const rows=q=>getDocs(q).then(s=>s.docs.map(d=>({id:d.id,...d.data()})));
let U=null,ME=null,CFG=DEF,tab="home";
const isAd=()=>U?.email==="admin@vl.app";

async function loadCfg(){const s=await getDoc(doc(db,"settings","main"));CFG={...DEF,...(s.exists()?s.data():{})}}
async function loadMe(){for(let i=0;i<6;i++){const s=await getDoc(doc(db,"users",U.uid));if(s.exists()){ME={id:U.uid,...s.data()};return}await sleep(400)}await setDoc(doc(db,"users",U.uid),{name:U.email.split("@")[0],balance:0,total:0,banned:false,approved:false,dev:DEV,created:Date.now(),dayKey:"",dayCount:0,last:0});ME={id:U.uid,...(await getDoc(doc(db,"users",U.uid))).data()}}

// ====== ĐĂNG NHẬP ======
function loginView(){
 $("#app").innerHTML=`<div class="card auth"><h1 class="logo">VƯỢT<i>LINK</i> ARENA</h1><p class="mu">Vượt link, nhận xu, rút về ngân hàng.</p>
 <input id="u" placeholder="Tên đăng nhập" autocomplete="username"><input id="p" type="password" placeholder="Mật khẩu (từ 6 ký tự)" autocomplete="current-password">
 <div class="row"><button class="btn" id="li">Đăng nhập</button><button class="btn alt" id="rg">Tạo tài khoản</button></div></div>`;
 const cred=()=>{const u=$("#u").value.trim().toLowerCase(),p=$("#p").value;if(!/^[a-z0-9_]{3,20}$/.test(u)||p.length<6){toast("Tên 3-20 ký tự (a-z, 0-9, _) và mật khẩu từ 6 ký tự",0);return null}return[u+"@vl.app",p,u]};
 $("#li").onclick=async()=>{const c=cred();if(!c)return;try{await signInWithEmailAndPassword(auth,c[0],c[1])}catch{toast("Sai tên đăng nhập hoặc mật khẩu",0)}};
 $("#rg").onclick=async()=>{const c=cred();if(!c)return;if(localStorage.reg)return toast("Thiết bị này đã đăng ký một tài khoản rồi. Hãy đăng nhập tài khoản đó.",0);try{const r=await createUserWithEmailAndPassword(auth,c[0],c[1]);await setDoc(doc(db,"users",r.user.uid),{name:c[2],balance:0,total:0,banned:false,approved:false,dev:DEV,created:Date.now(),dayKey:"",dayCount:0,last:0});localStorage.reg=1}catch(e){toast(ERR[e.code]||"Lỗi đăng ký: "+(e.code||e.message),0)}};
}
onAuthStateChanged(auth,async u=>{U=u;if(!u){loginView();return}try{await Promise.all([loadCfg(),loadMe()]);shell()}catch(e){const c=e.code||e.message||String(e);$("#app").innerHTML=`<div class="card auth"><h2 style="color:var(--bad)">Không tải được dữ liệu</h2><p>Mã lỗi: <b>${esc(c)}</b></p><p class="mu">${c==="permission-denied"?"Firestore đang chặn: vào Firestore Database > Rules, dán Rules ở đầu file index.html rồi bấm Publish.":/unavailable|not-found|failed-precondition/.test(c)?"Có vẻ chưa tạo Firestore: vào Firestore Database và bấm Create database.":"Kiểm tra mạng rồi thử lại."}</p><div class="row"><button class="btn" onclick="location.reload()">Thử lại</button><button class="btn alt" id="lo">Đăng xuất</button></div></div>`;$("#lo").onclick=()=>signOut(auth)}});

// ====== KHUNG CHÍNH ======
function shell(){
 if(ME.banned){$("#app").innerHTML=`<div class="card auth"><h2 style="color:var(--bad)">Tài khoản đã bị khóa</h2><p>Liên hệ admin nếu bạn nghĩ đây là nhầm lẫn.</p><button class="btn alt" id="lo">Đăng xuất</button></div>`;$("#lo").onclick=()=>signOut(auth);return}
 if(ME.approved===false&&!isAd()){$("#app").innerHTML=`<div class="card auth"><h2 style="color:var(--gold)">Tài khoản đang chờ admin duyệt</h2><p>Để tránh một người tạo nhiều tài khoản, mỗi tài khoản mới cần được admin duyệt trước khi dùng. Bạn thử lại sau nhé.</p><div class="row"><button class="btn" id="rf">Kiểm tra lại</button><button class="btn alt" id="lo">Đăng xuất</button></div></div>`;$("#lo").onclick=()=>signOut(auth);$("#rf").onclick=async()=>{await loadMe();shell()};return}
 const t=[["home","Trang chủ"],["task","Nhiệm vụ"],["rut","Rút tiền"],["top","Xếp hạng"]];if(isAd())t.push(["admin","Admin"]);
 $("#app").innerHTML=`<header><span class="logo">VƯỢT<i>LINK</i></span><span><span class="coin" id="bal"></span> <button class="mini" id="lo">Thoát</button></span></header><main id="m"></main><nav>${t.map(x=>`<button data-t="${x[0]}">${x[1]}</button>`).join("")}</nav>`;
 $("#lo").onclick=()=>signOut(auth);
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
 go(tab);
}
const hdr=()=>{const b=$("#bal");if(b)b.textContent=fmt(ME.balance)};
async function go(t){tab=t;hdr();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));const m=$("#m");m.innerHTML='<p class="mu">Đang tải...</p>';try{await({home:pHome,task:pTask,rut:pRut,top:pTop,admin:pAdmin})[t](m)}catch(e){console.error(e);m.innerHTML='<div class="card">Không tải được. Kiểm tra mạng hoặc Firestore Rules rồi thử lại.</div>'}}
const today=()=>ME.dayKey===day()?ME.dayCount:0;

// ====== TRANG CHỦ ======
async function pHome(m){
 await loadMe();hdr();const c=today(),l=CFG.lim,pc=l>0?Math.min(100,c/l*100):0;
 m.innerHTML=`${CFG.ann?`<div class="card" style="border-color:var(--gold)"><h2 style="color:var(--gold)">Thông báo</h2>${esc(CFG.ann)}</div>`:""}
 <div class="card hero"><span class="mu">Chào ${esc(ME.name)}, số dư của bạn</span><div class="big">${fmt(ME.balance)}</div>
 <div class="mu">Tiến độ hôm nay: <b style="color:var(--tx)">${c}${l>0?" / "+l:""}</b> nhiệm vụ, mỗi nhiệm vụ +${fmt(CFG.tien)}</div>
 ${l>0?`<div class="xp" style="margin-top:8px"><b style="width:${pc}%"></b></div>`:""}</div>
 <div class="row"><button class="btn" id="g1">Làm nhiệm vụ</button><button class="btn mg" id="g2">Rút tiền</button></div>
 <p class="mu" style="text-align:center">Tổng đã hoàn thành: ${ME.total||0} nhiệm vụ</p>`;
 $("#g1").onclick=()=>go("task");$("#g2").onclick=()=>go("rut");
}

// ====== NHIỆM VỤ ======
async function curTask(){const r=await rows(query(collection(db,"tasks"),where("uid","==",U.uid),where("status","==","pending")));return r.filter(t=>Date.now()-t.created<CFG.exp*6e4).sort((a,b)=>b.created-a.created)[0]}
async function pTask(m){
 await loadMe();hdr();const t=await curTask(),l=CFG.lim;
 m.innerHTML=`<div class="card"><h2>NHIỆM VỤ</h2><p class="mu">Hôm nay ${today()}${l>0?"/"+l:""} · Thưởng ${fmt(CFG.tien)} · Key hết hạn sau ${CFG.exp} phút</p>
 ${t?`<p>1. Mở link và vượt hết các bước.<br>2. Copy key hiện ra.<br>3. Dán key vào ô dưới.</p><a class="btn" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px" href="${esc(t.url)}" target="_blank" rel="noopener">Mở link vượt</a>
 <input id="k" placeholder="Dán key vào đây" autocomplete="off"><button class="btn mg" id="sk">Nhận thưởng</button>`
 :`<button class="btn" id="nt">Nhận nhiệm vụ mới</button>`}</div>`;
 if(t)$("#sk").onclick=()=>sendKey(t);else $("#nt").onclick=newTask;
}
async function newTask(){
 if(CFG.lim>0&&today()>=CFG.lim)return toast(`Hôm nay bạn đã làm đủ ${CFG.lim} nhiệm vụ. Quay lại vào ngày mai.`,0);
 const left=Math.ceil((CFG.cd*1e3-(Date.now()-ME.last))/1e3);if(left>0)return toast(`Nghỉ thêm ${left} giây rồi nhận tiếp`,0);
 $("#nt").disabled=true;const key=rnd(12);
 const long=`${LAG}?vlpcode=${key}&vlpsid=${rnd(16)}&vlpuser=${U.uid}&vlpitem=task&vlpround=1&vlpts=${Date.now()}&vlpmin=${CFG.wait}`;
 let url;try{const j=await(await fetch(`https://sitetop.net/api?api=${SHORT_KEY}&url=${encodeURIComponent(long)}`)).json();url=j.shortenedUrl||j.short_url}catch{}
 if(!url||url===long||url.startsWith(LAG)){toast("Không tạo được link, thử lại sau",0);return go("task")}
 await addDoc(collection(db,"tasks"),{uid:U.uid,key,url,status:"pending",created:Date.now()});go("task");
}
async function sendKey(t){
 if((+localStorage.lk||0)>Date.now())return toast(`Bạn bị khóa nhập key, thử lại sau ${Math.ceil((localStorage.lk-Date.now())/6e4)} phút`,0);
 const bad=msg=>{const n=(+localStorage.fl||0)+1;if(n>=5){localStorage.lk=Date.now()+6e5;localStorage.fl=0;toast("Sai quá nhiều lần, khóa nhập key 10 phút",0)}else{localStorage.fl=n;toast(`${msg} (còn ${5-n} lần thử)`,0)}};
 const k=$("#k").value.trim().toUpperCase();
 if(k!==t.key)return bad("Key không đúng");
 if(Date.now()-t.created<CFG.wait*1e3)return bad("Bạn chưa vượt link xong");
 try{await runTransaction(db,async tx=>{const tr=doc(db,"tasks",t.id),ur=doc(db,"users",U.uid),[ts,us]=[await tx.get(tr),await tx.get(ur)];
  if(ts.data().status!=="pending")throw 1;const u=us.data(),d=day();
  tx.update(tr,{status:"done",done:Date.now()});
  tx.update(ur,{balance:u.balance+CFG.tien,total:(u.total||0)+1,dayKey:d,dayCount:(u.dayKey===d?u.dayCount:0)+1,last:Date.now()})})}
 catch{return toast("Key này đã được dùng",0)}
 localStorage.fl=0;toast("Nhận thưởng +"+fmt(CFG.tien));go("task");
}

// ====== RÚT TIỀN ======
async function pRut(m){
 await loadMe();hdr();
 const[bk,ws]=await Promise.all([rows(query(collection(db,"banks"),where("uid","==",U.uid))),rows(query(collection(db,"withdrawals"),where("uid","==",U.uid)))]);
 const wds=ws.sort((a,b)=>b.created-a.created).slice(0,10),pend=wds.some(w=>w.status==="pending");
 m.innerHTML=`<div class="card"><h2>TÀI KHOẢN NGÂN HÀNG (${bk.length}/3)</h2>
 ${bk.map(b=>`<div class="item"><span>${esc(b.bank)} · <b>${esc(b.stk)}</b><br><span class="mu">${esc(b.name)}</span></span><button class="mini bad" data-del="${b.id}">Xóa</button></div>`).join("")||'<p class="mu">Bạn chưa thêm tài khoản nào. Thêm một tài khoản để rút tiền.</p>'}
 ${bk.length<3?`<select id="bk">${BANKS.map(b=>`<option>${b}</option>`).join("")}</select><input id="stk" inputmode="numeric" placeholder="Số tài khoản"><input id="bn" placeholder="Tên chủ tài khoản (in hoa, không dấu)"><button class="btn alt" id="ab">Thêm tài khoản</button>`:""}</div>
 <div class="card"><h2>RÚT TIỀN</h2><p class="mu">Số dư ${fmt(ME.balance)} · Tối thiểu ${fmt(CFG.min)} · Tiền được trừ khi admin duyệt đơn</p>
 ${pend?'<p class="pending">Bạn đang có một đơn chờ duyệt. Chờ admin xử lý xong rồi rút tiếp.</p>':bk.length?`<select id="wb">${bk.map(b=>`<option value="${b.id}">${esc(b.bank)} - ${esc(b.stk)}</option>`).join("")}</select><input id="am" inputmode="numeric" placeholder="Số tiền muốn rút"><div class="row"><button class="btn alt" id="all">Rút hết</button><button class="btn mg" id="wd">Gửi yêu cầu</button></div>`:""}</div>
 <div class="card"><h2>LỊCH SỬ RÚT</h2>${wds.map(w=>`<div class="item"><span>${fmt(w.amount)}<br><span class="mu">${esc(w.bank)} · ${new Date(w.created).toLocaleDateString("vi-VN")}</span></span><span class="tag ${w.status}">${ST[w.status]}</span></div>`).join("")||'<p class="mu">Chưa có đơn rút nào.</p>'}</div>`;
 m.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{await deleteDoc(doc(db,"banks",b.dataset.del));go("rut")});
 if($("#ab"))$("#ab").onclick=async()=>{const stk=$("#stk").value.replace(/\s/g,""),name=$("#bn").value.trim().toUpperCase();
  if(!/^\d{6,20}$/.test(stk)||name.length<3)return toast("Nhập số tài khoản (6-20 số) và tên chủ tài khoản",0);
  await addDoc(collection(db,"banks"),{uid:U.uid,bank:$("#bk").value,stk,name});toast("Đã thêm tài khoản");go("rut")};
 if($("#all"))$("#all").onclick=()=>$("#am").value=ME.balance;
 if($("#wd"))$("#wd").onclick=async()=>{const a=num($("#am").value),b=bk.find(x=>x.id===$("#wb").value);
  if(a<CFG.min)return toast("Tối thiểu rút "+fmt(CFG.min),0);if(a>ME.balance)return toast("Số dư không đủ",0);
  await addDoc(collection(db,"withdrawals"),{uid:U.uid,uname:ME.name,amount:a,bank:b.bank,stk:b.stk,name:b.name,status:"pending",created:Date.now()});toast("Đã gửi yêu cầu rút "+fmt(a));go("rut")};
}

// ====== XẾP HẠNG ======
async function pTop(m){
 const r=await rows(query(collection(db,"users"),orderBy("total","desc"),limit(10)));
 m.innerHTML=`<div class="card"><h2>TOP 10 VƯỢT LINK</h2>${r.filter(u=>u.total>0).map((u,i)=>`<div class="rk ${u.id===U.uid?"me":""}"><span class="n">${i+1}</span><span>${esc(u.name)}</span><span class="c">${u.total}</span></div>`).join("")||'<p class="mu">Chưa có ai vượt link. Hãy là người đầu tiên.</p>'}</div>`;
}

// ====== ADMIN ======
async function pAdmin(m=$("#m")){
 if(!isAd())return;await loadCfg();
 const[wd,us,rg]=await Promise.all([rows(query(collection(db,"withdrawals"),where("status","==","pending"))),rows(query(collection(db,"users"),orderBy("created","desc"),limit(50))),rows(query(collection(db,"users"),where("approved","==",false)))]);
 const all=[...new Map([...rg,...us].map(u=>[u.id,u])).values()],dup=u=>u.dev?all.filter(x=>x.dev===u.dev).length:1;
 const pr=rg.filter(u=>!u.banned).sort((a,b)=>a.created-b.created);
 m.innerHTML=`<div class="card"><h2>ĐĂNG KÝ CHỜ DUYỆT (${pr.length})</h2>${pr.map(u=>`<div class="item"><span><b>${esc(u.name)}</b><br><span class="mu">${new Date(u.created).toLocaleString("vi-VN")}</span>${dup(u)>1?`<br><span class="pending">⚠️ ${dup(u)} tài khoản cùng thiết bị</span>`:""}</span><span><button class="mini ok" data-ap="${u.id}">Duyệt</button> <button class="mini bad" data-rj="${u.id}">Từ chối</button></span></div>`).join("")||'<p class="mu">Không có đăng ký nào đang chờ.</p>'}</div>
 <div class="card"><h2>ĐƠN RÚT CHỜ DUYỆT (${wd.length})</h2>${wd.sort((a,b)=>a.created-b.created).map(w=>`<div class="item"><span><b>${esc(w.uname)}</b> · ${fmt(w.amount)}<br><span class="mu">${esc(w.bank)} · ${esc(w.stk)} · ${esc(w.name)}</span></span><span><button class="mini ok" data-ok="${w.id}">Duyệt</button> <button class="mini bad" data-no="${w.id}">Từ chối</button></span></div>`).join("")||'<p class="mu">Không có đơn nào đang chờ.</p>'}</div>
 <div class="card"><h2>CÀI ĐẶT</h2>${Object.keys(SET).map(k=>`<label class="mu">${SET[k]}</label><input data-s="${k}" inputmode="numeric" value="${CFG[k]}">`).join("")}
 <label class="mu">Thông báo gửi tới mọi người dùng (để trống để tắt)</label><textarea id="an" rows="3">${esc(CFG.ann)}</textarea><button class="btn" id="sv">Lưu cài đặt</button></div>
 <div class="card"><h2>NGƯỜI DÙNG (${us.length})</h2>${us.map(u=>`<div class="item"><span>${u.banned?"🚫 ":u.approved===false?"⏳ ":""}<b>${esc(u.name)}</b><br><span class="mu">${fmt(u.balance)} · ${u.total||0} nhiệm vụ</span></span><span><button class="mini" data-m="${u.id}">±Xu</button> <button class="mini ${u.banned?"ok":"bad"}" data-b="${u.id}" data-v="${u.banned?0:1}">${u.banned?"Mở khóa":"Khóa"}</button></span></div>`).join("")}</div>`;
 m.querySelectorAll("[data-ap]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"users",b.dataset.ap),{approved:true});toast("Đã duyệt tài khoản");pAdmin()});
 m.querySelectorAll("[data-rj]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"users",b.dataset.rj),{banned:true});toast("Đã từ chối và khóa tài khoản");pAdmin()});
 m.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>decide(b.dataset.ok,1));
 m.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>decide(b.dataset.no,0));
 m.querySelectorAll("[data-b]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"users",b.dataset.b),{banned:b.dataset.v==="1"});pAdmin()});
 m.querySelectorAll("[data-m]").forEach(b=>b.onclick=async()=>{const v=parseInt(prompt("Nhập số tiền cộng (số dương) hoặc trừ (số âm):"));if(!v)return;
  try{await runTransaction(db,async tx=>{const r=doc(db,"users",b.dataset.m),s=await tx.get(r);if(s.data().balance+v<0)throw 1;tx.update(r,{balance:s.data().balance+v})});toast("Đã cập nhật số dư")}catch{toast("Số dư không đủ để trừ",0)}pAdmin()});
 $("#sv").onclick=async()=>{const d={ann:$("#an").value.trim()};m.querySelectorAll("[data-s]").forEach(i=>d[i.dataset.s]=num(i.value));await setDoc(doc(db,"settings","main"),d,{merge:true});toast("Đã lưu cài đặt");pAdmin()};
}
async function decide(id,ok){
 try{await runTransaction(db,async tx=>{const wr=doc(db,"withdrawals",id),w=await tx.get(wr);if(w.data().status!=="pending")throw"Đơn này đã được xử lý";
  if(ok){const ur=doc(db,"users",w.data().uid),u=await tx.get(ur);if(u.data().balance<w.data().amount)throw"Ví người dùng không đủ tiền";tx.update(ur,{balance:u.data().balance-w.data().amount})}
  tx.update(wr,{status:ok?"approved":"rejected"})});toast(ok?"Đã duyệt. Nhớ chuyển khoản cho người dùng.":"Đã từ chối đơn")}
 catch(e){toast(typeof e==="string"?e:"Lỗi, thử lại",0)}pAdmin();
}
</script></body></html>
