<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#888);--btn:var(--tg-theme-button-color,#2481cc);--btx:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f1f1f4)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:12px 12px 80px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bal{background:var(--btn);color:var(--btx);padding:6px 12px;border-radius:20px;font-weight:600}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{color:var(--hint);font-size:13px}
button{background:var(--btn);color:var(--btx);border:0;border-radius:8px;padding:8px 14px;font-size:14px}
button:disabled{opacity:.4}
.qty{display:flex;align-items:center;gap:8px}.qty button{padding:4px 10px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{flex:1;text-align:center;padding:12px 0;color:var(--hint)}.tabs .on{color:var(--btn);font-weight:600}
code{display:block;background:var(--bg);padding:6px;border-radius:6px;margin-top:4px;word-break:break-all;font-size:13px}
</style>
</head>
<body>
<div class="head"><b id="hi">Đang tải...</b><span class="bal" id="bal">—</span></div>
<div id="view"></div>
<div class="tabs"><div id="t_shop" class="on">🛒 Cửa hàng</div><div id="t_orders">📜 Đơn hàng</div></div>
<script>
// Đổi thành địa chỉ HTTPS public của API bot (cloudflared/ngrok), không có dấu / ở cuối
const API = "https://YOUR-TUNNEL-URL";
const tg = Telegram.WebApp; tg.ready(); tg.expand();
let S = null, tab = "shop", qty = {};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => Number(n).toLocaleString("vi-VN") + "đ";

async function call(path, body) {
  const r = await fetch(API + path, {method: "POST",
    headers: {"Content-Type": "application/json", "X-Init-Data": tg.initData, "ngrok-skip-browser-warning": "1"},
    body: JSON.stringify(body || {})});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function load() {
  try {
    S = await call("/api/me");
    document.getElementById("hi").textContent = "Chào " + S.user.name;
    document.getElementById("bal").textContent = money(S.balance);
    render();
  } catch (e) {
    document.getElementById("view").innerHTML = '<div class="card">❌ ' + esc(e.message) + '</div>';
  }
}

function render() {
  const v = document.getElementById("view");
  document.getElementById("t_shop").className = tab === "shop" ? "on" : "";
  document.getElementById("t_orders").className = tab === "orders" ? "on" : "";
  if (tab === "shop") {
    if (S.maint) v.innerHTML = '<div class="card">🔧 Hệ thống đang bảo trì, quay lại sau nhé.</div>';
    else if (!S.products.length) v.innerHTML = '<div class="card hint">Chưa có sản phẩm.</div>';
    else v.innerHTML = S.products.map(p => {
      const q = qty[p.id] || 1;
      return '<div class="card"><div class="row"><b>' + esc(p.name) + '</b><b>' + money(p.price) + '</b></div>' +
        '<div class="hint">' + (p.stock > 0 ? 'Còn ' + p.stock : 'Hết hàng') + '</div>' +
        '<div class="row" style="margin-top:8px"><div class="qty"><button onclick="chg(' + p.id + ',-1)">−</button><span>' + q +
        '</span><button onclick="chg(' + p.id + ',1)">+</button></div>' +
        '<button ' + (p.stock > 0 ? '' : 'disabled') + ' onclick="buy(' + p.id + ')">Mua ' + money(p.price * q) + '</button></div></div>';
    }).join("");
  } else {
    v.innerHTML = S.orders.length ? S.orders.map(o =>
      '<div class="card"><div class="row"><b>' + esc(o.name) + ' x' + o.qty + '</b><span>' + money(o.total) + '</span></div>' +
      '<div class="hint">' + esc(o.at) + '</div>' +
      String(o.keys || "").split("\n").filter(Boolean).map(k => '<code>' + esc(k) + '</code>').join("") + '</div>'
    ).join("") : '<div class="card hint">Chưa có đơn nào.</div>';
  }
}

function chg(id, d) {
  const p = S.products.find(x => x.id === id);
  qty[id] = Math.max(1, Math.min(p.stock, (qty[id] || 1) + d));
  render();
}

function buy(id) {
  const p = S.products.find(x => x.id === id), q = qty[id] || 1;
  tg.showConfirm("Mua " + p.name + " x" + q + " = " + money(p.price * q) + "?", async ok => {
    if (!ok) return;
    try {
      const r = await call("/api/buy", {pid: id, qty: q, price: p.price});
      if (r.ok) { tg.HapticFeedback.notificationOccurred("success"); qty[id] = 1; tab = "orders"; await load(); }
      else tg.showAlert(r.need ? "Không đủ số dư, cần " + money(r.need) : (r.msg || "Mua thất bại"));
    } catch (e) { tg.showAlert(e.message); }
  });
}

document.getElementById("t_shop").onclick = () => { tab = "shop"; render(); };
document.getElementById("t_orders").onclick = () => { tab = "orders"; render(); };
load();
</script>
</body>
</html>
